<!DOCTYPE html>
<!-- Development work by David Lane -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lane HyperFrame — DevConnect Labs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/family/css/lane-hyperframe-line.css" />
</head>
<body class="lhf-page">
  <main class="lhf-wrap">
    <article class="lhf-card" id="lhfCard" hidden>
      <img class="lhf-portrait" id="lhfPortrait" alt="" />
      <div class="lhf-body">
        <p class="lhf-kicker">Lane Legacy · HyperFrame</p>
        <h1 class="lhf-name" id="lhfName"></h1>
        <p class="lhf-years" id="lhfYears"></p>
        <p class="lhf-tagline" id="lhfTagline"></p>
        <div class="lhf-play-wrap" id="lhfPlayWrap"></div>
        <div class="lhf-links" id="lhfLinks"></div>
      </div>
    </article>
    <p id="lhfLoading" class="text-center text-muted">Loading…</p>
    <footer class="lhf-credits" role="contentinfo" aria-label="Credits">
      <p class="lhf-credits-dev" id="lhfCreditsDev"></p>
    </footer>
  </main>

  <div class="lhf-popup-backdrop" id="lhfPopup" hidden role="dialog" aria-modal="true" aria-labelledby="lhfPopupTitle">
    <div class="lhf-popup">
      <div class="lhf-popup-head">
        <span id="lhfPopupTitle">Watch story</span>
        <button type="button" class="btn btn-sm btn-close" id="lhfPopupClose" aria-label="Close"></button>
      </div>
      <div class="lhf-popup-body" id="lhfPopupBody"></div>
    </div>
  </div>

  <script src="/family/js/lane-hyperframe-line.js"></script>
</body>
</html>
