<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lane Direct Ancestor Story - DevConnect Labs</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/shared/styles.css" />
  <link rel="stylesheet" href="/family/css/lane-direct-ancestor-story.css" />
  <script src="/shared/modern-navbar.js"></script>
</head>
<body class="lane-direct-page">
  <modern-navbar></modern-navbar>
  <main class="direct-wrap">
    <section class="direct-card direct-header">
      <div class="direct-kicker">My Line Only</div>
      <h1 class="h3 mb-2">Direct Ancestor Story Mode</h1>
      <p class="text-muted mb-2">
        Starts from Alderman Homer R Lane and follows direct parent links only, generation by generation.
      </p>
      <div class="custom-control custom-switch mb-2">
        <input type="checkbox" class="custom-control-input" id="lineOnlyToggle" checked />
        <label class="custom-control-label" for="lineOnlyToggle">My line only (hide spouse and children context)</label>
      </div>
      <div id="directMeta" class="small text-muted"></div>
      <div id="directError" class="small text-warning mt-2"></div>
    </section>

    <section id="directTimeline" class="direct-timeline"></section>

    <section class="direct-card direct-footer mt-3">
      <h3 class="h6 mb-2"><i class="bi-person-plus"></i> Add Later-Generation Descendants (Draft)</h3>
      <p class="small text-muted mb-2">
        This is a local draft list for your direct line notes. It does not change `laneData.json`.
      </p>
      <form id="descendantForm" class="form-row align-items-end">
        <div class="form-group col-md-4">
          <label class="small mb-1" for="descName">Name</label>
          <input id="descName" class="form-control form-control-sm" placeholder="Full name" required />
        </div>
        <div class="form-group col-md-2">
          <label class="small mb-1" for="descBirthYear">Birth Year</label>
          <input id="descBirthYear" class="form-control form-control-sm" placeholder="YYYY" />
        </div>
        <div class="form-group col-md-4">
          <label class="small mb-1" for="descRelation">Relation</label>
          <input id="descRelation" class="form-control form-control-sm" placeholder="e.g. son, nephew" />
        </div>
        <div class="form-group col-md-2">
          <button type="submit" class="btn btn-sm btn-outline-light btn-block">Add</button>
        </div>
      </form>
      <div id="descendantDraftList" class="desc-draft-list"></div>
      <button id="clearDescendantsBtn" class="btn btn-sm btn-outline-secondary mt-2">Clear Draft Descendants</button>
    </section>

    <section class="direct-card direct-footer mt-3">
      <a href="/family/genealogy.html" class="small"><i class="bi-arrow-left"></i> Back to Family Genealogy</a>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="/family/js/lane-direct-ancestor-story.js"></script>
</body>
</html>
