<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Western settlement routes converging at Lane's Crossing">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8dcc8"/>
      <stop offset="100%" stop-color="#d4c4a8"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6a9eb8"/>
      <stop offset="100%" stop-color="#4a7a94"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" fill="url(#sky)"/>
  <text x="360" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#3d3428">Routes at Lane&apos;s Crossing (diagram)</text>
  <!-- desert -->
  <rect x="0" y="60" width="720" height="360" fill="#c9b896" opacity="0.45"/>
  <!-- Mojave River -->
  <path d="M 40 280 Q 200 260 360 270 T 680 250" fill="none" stroke="url(#river)" stroke-width="14" stroke-linecap="round"/>
  <text x="360" y="305" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2a4a5a">Mojave River · Lower Narrows</text>
  <!-- routes -->
  <path d="M 80 100 Q 180 180 320 255" fill="none" stroke="#8b4513" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="95" y="92" font-family="sans-serif" font-size="12" fill="#5c3d1e">Mormon Road</text>
  <text x="95" y="108" font-family="sans-serif" font-size="10" fill="#5c3d1e">Salt Lake ’ LA</text>
  <path d="M 620 80 Q 520 160 400 255" fill="none" stroke="#6b4e2e" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="540" y="72" font-family="sans-serif" font-size="12" fill="#5c3d1e">Mojave Road</text>
  <text x="540" y="88" font-family="sans-serif" font-size="10" fill="#5c3d1e">Prescott ’ Wilmington</text>
  <path d="M 360 60 L 360 240" fill="none" stroke="#4a6741" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="370" y="78" font-family="sans-serif" font-size="11" fill="#3d5236">Mohave Trail</text>
  <path d="M 360 270 L 620 340" fill="none" stroke="#7a5230" stroke-width="3"/>
  <text x="520" y="360" font-family="sans-serif" font-size="11" fill="#5c3d1e">’ Cajon Pass ’ Los Angeles</text>
  <text x="520" y="376" font-family="sans-serif" font-size="10" fill="#7a5230">Last Crossing of the Mojave</text>
  <!-- pin -->
  <circle cx="360" cy="262" r="16" fill="#8b7355" stroke="#fff" stroke-width="3"/>
  <circle cx="360" cy="262" r="5" fill="#fff"/>
  <text x="360" y="238" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#3d3428">Lane&apos;s Crossing</text>
  <text x="360" y="400" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6a6054">Not to scale · Victor Valley / San Bernardino Co., Calif.</text>
</svg>
