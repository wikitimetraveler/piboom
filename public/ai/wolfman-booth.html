<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Wolfman Dave booth</title>
  <link rel="stylesheet" href="/shared/design-tokens.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <script src="/shared/menu-config.js"></script>
  <script src="/shared/modern-navbar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.8/dist/livekit-client.umd.min.js"></script>
  <script src="/shared/js/livekit-talk-audio.js"></script>
  <style>
    body { background: #0e1412; color: #d7ece4; font-family: Georgia, serif; margin: 0; }
    main { max-width: 42rem; margin: 2rem auto; padding: 0 1.25rem 4rem; }
    h1 { font-weight: 700; letter-spacing: 0.04em; }
    .lede { color: #9bb8ae; }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; }
    button, input {
      background: #1c2a26; color: inherit; border: 1px solid #3d5c52;
      border-radius: 8px; padding: 0.55rem 0.9rem; font: inherit;
    }
    button.primary { background: #3d7a64; border-color: #4e9a7d; }
    #wbLog { min-height: 10rem; border: 1px solid #3d5c52; border-radius: 10px; padding: 0.75rem; }
    #wbLog p { margin: 0.35rem 0; }
    .status { font-size: 0.9rem; color: #8fb5a8; }
  </style>
</head>
<body class="encompass-dark-mode">
  <modern-navbar></modern-navbar>
  <main>
    <p class="status">LiveKit booth · same keys as StarBand</p>
    <h1>Wolfman Dave</h1>
    <p class="lede">Join the lobby. Talk. The DJ agent joins when the Python worker is running as WolfmanDave. Typed lines also go out on a LiveKit data packet so everyone sees the same chat.</p>
    <p>
      <a href="/ai/voice-dj.html">Classic Voice DJ</a>
    </p>
    <div class="row">
      <input id="wbName" value="Listener" maxlength="40" aria-label="Display name"/>
      <button class="primary" id="wbJoin" type="button">Join booth</button>
      <button id="wbMic" type="button" disabled aria-pressed="false">Mic off</button>
    </div>
    <p class="status" id="wbStatus">LiveKit…</p>
    <div id="wbLog"></div>
    <form class="row" id="wbForm">
      <input id="wbText" placeholder="Say a title or a request…" autocomplete="off" style="flex:1"/>
      <button class="primary" type="submit">Send</button>
    </form>
  </main>
  <script src="/ai/js/wolfman-booth.js"></script>
</body>
</html>
