<!DOCTYPE html>
<!-- Development work by David Lane -->
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Listening room — StarBand lounge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="/shared/design-tokens.css"/>
  <link rel="stylesheet" href="/studio/css/studio.css"/>
  <script src="/shared/menu-config.js"></script>
  <script src="/shared/modern-navbar.js"></script>
  <script src="/shared/demo-users.js"></script>
  <script src="/shared/user-selector.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="st-page encompass-dark-mode">
  <div class="st-glow" aria-hidden="true"></div>
  <div class="st-scanlines" aria-hidden="true"></div>
  <modern-navbar></modern-navbar>
  <main class="st-listen">
    <p class="st-kicker">Palace lounge</p>
    <h1>What's out</h1>
    <p class="st-lead">Bounces from the desk land here as gold sleeves. Same password for everyone on the reel.</p>

    <form id="stUnlock" class="st-gate-card">
      <label class="st-status" for="stPassword">Listening password</label>
      <input id="stPassword" type="password" autocomplete="current-password" placeholder="reel1"/>
      <div class="st-transport" style="margin-top:0.75rem">
        <button type="submit" class="st-btn st-btn--primary">Unlock</button>
        <a class="st-btn st-btn--ghost" href="/studio/desk.html">Back to desk</a>
      </div>
      <p class="st-status" id="stUnlockMsg"></p>
    </form>

    <section id="stLounge" class="st-lounge" hidden>
      <div class="st-lounge-stage">
        <div class="st-sleeve-wrap">
          <div class="st-sleeve" id="stSleeve">
            <canvas id="stTitleCard" width="640" height="640" aria-label="Release title card"></canvas>
          </div>
          <div class="st-platter" id="stPlatter" aria-hidden="true">
            <div class="st-reel st-reel--listen"></div>
          </div>
        </div>
        <div class="st-lounge-copy">
          <p class="st-kicker" id="stNowKicker">Now out</p>
          <h2 class="st-now-title" id="stNowTitle">The lounge is empty</h2>
          <p class="st-lead" id="stNowMeta">Record on the desk, then Release.</p>
          <div class="st-transport">
            <button type="button" class="st-btn st-btn--primary" id="stLoungePlay" disabled>Play</button>
            <a class="st-btn st-btn--ghost" href="/studio/desk.html">Back to desk</a>
          </div>
        </div>
      </div>
      <div class="st-sleeves" id="stSleeves"></div>
      <audio id="stLoungeAudio" class="st-lounge-audio" preload="none"></audio>
    </section>
  </main>
  <script src="/studio/js/studio-listen.js"></script>
</body>
</html>
