<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AI Assistant Test</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"/>
</head>
<body>
<div class="container mt-4">
  <h1>AI Assistant Test</h1>
  
  <!-- AI Assistant Section -->
  <div class="card mb-4">
    <div class="card-header" style="background: linear-gradient(135deg, rgba(255,182,193,0.8) 0%, rgba(221,160,221,0.8) 100%);">
      <h5 class="mb-0">
        <i class="bi-robot"></i> AI Assistant
        <button class="btn btn-sm btn-outline-light float-right" type="button" data-toggle="collapse" data-target="#aiAssistant" aria-expanded="true">
          <i class="bi-chevron-down"></i>
        </button>
      </h5>
    </div>
    <div class="collapse show" id="aiAssistant">
      <div class="card-body">
        <div class="row">
          <div class="col-md-4">
            <h6><i class="bi-chat-dots"></i> Chat with AI</h6>
            <div class="mb-3">
              <textarea id="aiQuestion" class="form-control" rows="3" placeholder="Ask the AI about music..."></textarea>
            </div>
            <div class="btn-group mb-3" role="group">
              <button class="btn btn-sm btn-primary" onclick="askAI()">
                <i class="bi-send"></i> Ask AI
              </button>
              <button class="btn btn-sm btn-outline-secondary" onclick="clearAIChat()">
                <i class="bi-trash"></i> Clear
              </button>
            </div>
          </div>
          
          <div class="col-md-8">
            <h6><i class="bi-lightbulb"></i> AI Response</h6>
            <div id="aiResults" style="height: 200px; overflow-y: auto; border: 1px solid #e9ecef; border-radius: 8px; padding: 1rem; background: #f8f9fa;">
              <p class="text-muted mb-0">Ask the AI a question to see responses here.</p>
            </div>
          </div>
        </div>
        
        <div class="row mt-3">
          <div class="col-12">
            <h6><i class="bi-lightning"></i> Quick AI Suggestions</h6>
            <div class="btn-group mb-2" role="group">
              <button class="btn btn-sm btn-outline-primary" onclick="askAI('What are the key characteristics of progressive rock?')">
                <i class="bi-music-note-beamed"></i> Progressive Rock
              </button>
              <button class="btn btn-sm btn-outline-success" onclick="askAI('Recommend some underrated 70s bands')">
                <i class="bi-star"></i> 70s Recommendations
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function askAI(question = null) {
  const questionTextarea = document.getElementById('aiQuestion');
  const resultsDiv = document.getElementById('aiResults');
  
  let query = question || questionTextarea.value.trim();
  
  if (!query) {
    alert('Please enter a question first');
    return;
  }
  
  // If called from suggestion buttons, update textarea
  if (question) {
    questionTextarea.value = question;
  }
  
  // Show mock response
  const timestamp = new Date().toLocaleTimeString();
  resultsDiv.innerHTML = `
    <div class="ai-conversation">
      <div class="ai-question mb-3">
        <div class="d-flex align-items-start">
          <div class="flex-shrink-0 me-2">
            <i class="bi-person-circle text-primary" style="font-size: 1.5rem;"></i>
          </div>
          <div class="flex-grow-1">
            <strong class="text-primary">You asked:</strong>
            <p class="mb-1">"${query}"</p>
            <small class="text-muted">${timestamp}</small>
          </div>
        </div>
      </div>
      
      <div class="ai-answer">
        <div class="d-flex align-items-start">
          <div class="flex-shrink-0 me-2">
            <i class="bi-robot text-success" style="font-size: 1.5rem;"></i>
          </div>
          <div class="flex-grow-1">
            <strong class="text-success">AI Assistant:</strong>
            <div class="mt-2">This is a test response for: "${query}"</div>
            <small class="text-muted">${timestamp}</small>
          </div>
        </div>
      </div>
    </div>
  `;
}

function clearAIChat() {
  const questionTextarea = document.getElementById('aiQuestion');
  const resultsDiv = document.getElementById('aiResults');
  
  questionTextarea.value = '';
  resultsDiv.innerHTML = '<p class="text-muted mb-0">Ask the AI a question to see responses here.</p>';
}
</script>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.1/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
