  <desc id="miDesc">Concept medical pouch. Not for sale. Not a live menu.</desc>
  <defs>
    <linearGradient id="miBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141028"/>
      <stop offset="100%" stop-color="#050010"/>
    </linearGradient>
    <linearGradient id="miPouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4efe4"/>
      <stop offset="100%" stop-color="#d8c8a8"/>
