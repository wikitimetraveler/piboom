<!DOCTYPE html>
<!-- Development work by David Lane -->
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Planet world | DevConnect Labs</title>
  <meta name="description" content="NASA globe, research desk, and Carl AstroAI for one solar-system body."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"/>
  <link rel="stylesheet" href="/shared/styles.css"/>
  <link rel="stylesheet" href="/shared/css/planetarium-world.css?v=1"/>
  <script src="/shared/modern-navbar.js"></script>
  <script>window.__PLANETARIUM_WORLD = true;</script>
</head>
<body class="plan-world-page">
  <a class="visually-hidden-focusable" href="#pwGlobeCanvas">Skip to globe</a>
  <modern-navbar></modern-navbar>
  <main class="pw-wrap">
    <header class="pw-masthead">
      <p class="pw-kicker" id="pwKicker">Planet world</p>
      <h1 id="pwTitle">Loading…</h1>
      <p class="pw-lede" id="pwLede"></p>
      <p class="pw-status" id="pwStatus" role="status" aria-live="polite"></p>
      <div class="pw-nav-row" id="pwNavRow">
        <a class="pw-btn" href="/planetarium/worlds/"><i class="bi bi-grid-3x3-gap" aria-hidden="true"></i> All worlds</a>
        <a class="pw-btn pw-btn--primary" id="pwOpenSky" href="/planetarium/"><i class="bi bi-stars" aria-hidden="true"></i> Open in sky</a>
        <a class="pw-btn" id="pwPrev" href="#"><i class="bi bi-chevron-left" aria-hidden="true"></i> Prev</a>
        <a class="pw-btn" id="pwNext" href="#">Next <i class="bi bi-chevron-right" aria-hidden="true"></i></a>
      </div>
    </header>

    <div class="pw-layout">
      <section class="pw-stage" aria-label="Planet globe">
        <img class="pw-stage__fallback" id="pwFallback" alt="" hidden/>
        <canvas class="pw-stage__canvas" id="pwGlobeCanvas" role="img" aria-label="Planet globe"></canvas>
        <p class="pw-stage__credit" id="pwCredit"></p>
      </section>

      <aside class="pw-desk" aria-label="Research desk">
        <section class="pw-panel" aria-labelledby="pwFactsHeading">
          <h2 id="pwFactsHeading">At a glance</h2>
          <dl class="pw-facts" id="pwFacts"></dl>
        </section>

        <section class="pw-panel" aria-labelledby="pwLandmarkHeading">
          <h2 id="pwLandmarkHeading">Landmark</h2>
          <p class="pw-landmark" id="pwLandmark"></p>
          <div class="pw-nav-row" id="pwLandmarkActions" hidden></div>
        </section>

        <section class="pw-panel" aria-labelledby="pwMissionsHeading">
          <h2 id="pwMissionsHeading">Missions</h2>
          <ul class="pw-missions" id="pwMissions"></ul>
        </section>

        <section class="pw-panel pw-notes" aria-labelledby="pwNotesHeading">
          <h2 id="pwNotesHeading">Research notes</h2>
          <div id="pwNotes"></div>
          <p class="pw-folklore" id="pwFolklore" hidden></p>
        </section>

        <section class="pw-panel plan-carl-panel" aria-labelledby="pwCarlHeading">
          <h2 id="pwCarlHeading">Carl · AstroAI</h2>
          <p class="pw-carl-lead" id="pwCarlLead">Ask about this world — voice is on by default.</p>
          <button type="button" class="pw-btn pw-btn--primary" id="planAskCarl">
            <i class="bi bi-mic-fill" aria-hidden="true"></i> Ask Carl
          </button>
        </section>
      </aside>
    </div>

    <p class="pw-footer-links">
      <a href="/planetarium/worlds/">Planet worlds</a>
      ·
      <a href="/planetarium/">Full sky</a>
      ·
      <a href="/">Home</a>
    </p>
  </main>

  <script src="/shared/tts.js"></script>
  <script src="/shared/speech-recognition.js"></script>
  <script src="/shared/js/astronomy.browser.min.js"></script>
  <script src="/planetarium/js/celestial-engine.js?v=1"></script>
  <script src="/shared/js/fun-home-sky.js?v=8"></script>
  <script src="/shared/js/webgpu-runtime.js"></script>
  <script src="/shared/js/webgpu-globe.js?v=2"></script>
  <script type="module" src="/planetarium/js/planetarium-world.js?v=1"></script>
  <script type="module" src="/planetarium/js/planetarium-guide.js?v=3"></script>
</body>
</html>
