<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSE scenario analyzer – DevConnect Labs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/shared/styles.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-grid.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-alpine.css" />
    <link rel="stylesheet" href="/css/gse-analyzer.css" />
    <script src="/shared/menu-config.js"></script>
    <script src="/shared/modern-navbar.js" defer></script>
  </head>
  <body class="ag-theme-alpine">
    <div class="container py-4">
      <div class="gse-hero">
        <h1><i class="bi bi-diagram-3 me-2"></i>GSE product intelligence</h1>
        <p class="gse-disclaimer mb-0">
          Decision-support only. Uses bundled public-rule summaries and sample FHFA limits—not DU/LPA, not pricing, not
          approval. <span id="gseServerDisclaimer"></span>
        </p>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <div class="card gse-summary-card shadow-sm h-100">
            <div class="card-body">
              <h2 class="h6 text-muted">Summary</h2>
              <dl class="row small mb-0">
                <dt class="col-5">Best fit</dt>
                <dd class="col-7" id="gseBestFit">—</dd>
                <dt class="col-5">Risk (heuristic)</dt>
                <dd class="col-7" id="gseRisk">—</dd>
                <dt class="col-5">Conforming</dt>
                <dd class="col-7" id="gseConf">—</dd>
                <dt class="col-5">Limit (if known)</dt>
                <dd class="col-7" id="gseLimit">—</dd>
                <dt class="col-5">Products loaded</dt>
                <dd class="col-7" id="gseProductCount">—</dd>
              </dl>
              <p class="small text-warning mt-2 mb-0 d-none" id="gseInputWarnings"></p>
            </div>
          </div>
        </div>
        <div class="col-md-8">
          <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
              <span>Scenario (no PII)</span>
              <div class="btn-group btn-group-sm">
                <button type="button" class="btn btn-primary" id="btnAnalyze">Analyze</button>
                <button type="button" class="btn btn-outline-secondary" id="btnLoanLimits">Loan limit lookup</button>
              </div>
            </div>
            <div class="card-body">
              <div class="row g-2 small">
                <div class="col-md-3">
                  <label class="form-label">Credit score</label>
                  <input type="number" class="form-control" id="creditScore" value="720" />
                </div>
                <div class="col-md-3">
                  <label class="form-label">First-time buyer</label>
                  <select class="form-select" id="firstTimeHomebuyer">
                    <option value="true" selected>Yes</option>
                    <option value="false">No</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label">Income (annual)</label>
                  <input type="number" class="form-control" id="income" value="85000" />
                </div>
                <div class="col-md-3">
                  <label class="form-label">AMI % (optional)</label>
                  <input type="number" class="form-control" id="amiPercent" value="78" />
                </div>
                <div class="col-md-3">
                  <label class="form-label">Loan amount</label>
                  <input type="number" class="form-control" id="loanAmount" value="725000" />
                </div>
                <div class="col-md-3">
                  <label class="form-label">Purchase price</label>
                  <input type="number" class="form-control" id="purchasePrice" value="760000" />
                </div>
                <div class="col-md-2">
                  <label class="form-label">LTV</label>
                  <input type="number" class="form-control" id="ltv" value="95" />
                </div>
                <div class="col-md-2">
                  <label class="form-label">CLTV</label>
                  <input type="number" class="form-control" id="cltv" value="97" />
                </div>
                <div class="col-md-2">
                  <label class="form-label">Units</label>
                  <input type="number" class="form-control" id="units" value="1" min="1" max="4" />
                </div>
                <div class="col-md-2">
                  <label class="form-label">State</label>
                  <input type="text" class="form-control" id="state" value="CA" maxlength="2" />
                </div>
                <div class="col-md-2">
                  <label class="form-label">County</label>
                  <input type="text" class="form-control" id="county" value="Orange" />
                </div>
                <div class="col-md-3">
                  <label class="form-label">Occupancy</label>
                  <select class="form-select" id="occupancy">
                    <option value="primary" selected>Primary</option>
                    <option value="secondHome">Second home</option>
                    <option value="investment">Investment</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label">Purpose</label>
                  <select class="form-select" id="purpose">
                    <option value="purchase" selected>Purchase</option>
                    <option value="rateTermRefi">Rate/term refi</option>
                    <option value="cashOutRefi">Cash-out refi</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label">Property type</label>
                  <select class="form-select" id="propertyType">
                    <option value="singleFamily" selected>Single-family</option>
                    <option value="condo">Condo</option>
                    <option value="pud">PUD</option>
                    <option value="2unit">2 units</option>
                    <option value="3unit">3 units</option>
                    <option value="4unit">4 units</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label">DTI %</label>
                  <input type="number" class="form-control" id="dti" value="43" />
                </div>
                <div class="col-md-3">
                  <label class="form-label">Reserves (months)</label>
                  <input type="number" class="form-control" id="reservesMonths" value="2" />
                </div>
              </div>
              <label class="form-label mt-3">Or paste full scenario JSON (overrides form)</label>
              <textarea class="form-control font-monospace small" id="jsonPaste" rows="5" placeholder='{"borrower":{...},"loan":{...},"risk":{...}}'></textarea>
            </div>
          </div>
        </div>
      </div>

      <h2 class="h5 mb-2">Product fit</h2>
      <div id="gseProductsGrid" class="ag-theme-alpine" style="height: 320px; width: 100%"></div>

      <h2 class="h5 mt-4 mb-2">Suggestions</h2>
      <div id="gseSuggestionsGrid" class="ag-theme-alpine" style="height: 180px; width: 100%"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.noStyle.js"></script>
    <script src="/js/gse-analyzer.js"></script>
  </body>
</html>
