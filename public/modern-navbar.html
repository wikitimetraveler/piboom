<!-- Modern Professional Navbar - Include this in all pages -->
<style>
  /* Professional Modern Navigation */
  .modern-navbar {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(135, 206, 250, 0.2);
    padding: 0.5rem 0;
    position: sticky;
    top: 0;
    z-index: 1000;
    transition: all 0.3s ease;
    box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
  }
  
  .modern-navbar.scrolled {
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.12);
  }
  
  .navbar-brand-modern {
    font-size: 1.2rem;
    font-weight: 700;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .nav-user-btn {
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
    border: 2px solid rgba(102, 126, 234, 0.3);
    border-radius: 20px;
    padding: 6px 15px;
    transition: all 0.3s ease;
    font-size: 0.9rem;
  }
  
  .nav-user-btn:hover {
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
    border-color: #667eea;
    transform: translateY(-2px);
  }
  
  /* Modern Dropdown Menus */
  .dropdown-menu {
    border: none;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    padding: 10px;
    margin-top: 10px;
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(20px);
  }
  
  .dropdown-item {
    border-radius: 8px;
    padding: 10px 15px;
    transition: all 0.2s ease;
    margin-bottom: 2px;
  }
  
  .dropdown-item:hover {
    background: linear-gradient(135deg, rgba(102,126,234,0.1), rgba(118,75,162,0.1));
    color: #667eea;
    transform: translateX(5px);
  }
  
  .dropdown-item i {
    width: 20px;
    margin-right: 10px;
  }
  
  .dropdown-divider {
    border-top-color: rgba(135, 206, 250, 0.2);
  }
  
  /* Reduced floating elements for professional look */
  .musical-note {
    color: rgba(135, 206, 250, 0.3) !important;
    font-size: 28px !important;
  }
</style>

<script>
// Sticky navbar scroll effect - add to all pages
document.addEventListener('DOMContentLoaded', () => {
  const navbar = document.querySelector('.modern-navbar, .navbar');
  if (navbar) {
    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) {
        navbar.classList.add('scrolled');
        navbar.style.boxShadow = '0 4px 30px rgba(0, 0, 0, 0.12)';
      } else {
        navbar.classList.remove('scrolled');
        navbar.style.boxShadow = '0 2px 20px rgba(0, 0, 0, 0.08)';
      }
    });
  }
});
</script>
