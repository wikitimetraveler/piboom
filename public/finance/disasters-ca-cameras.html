<!DOCTYPE html>
<!--
  CA Fire Cameras — fixed ALERTCalifornia mounts (separate from rolling disaster events).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA Fire Cameras · ALERTCalifornia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        background: #f5f7fa;
        font-family: 'Inter', 'Segoe UI', sans-serif;
        min-height: 100vh;
      }
      .page-header {
        background: linear-gradient(135deg, #e67e22, #c0392b);
        color: #fff;
        padding: 1.25rem 0;
        margin-bottom: 1.5rem;
      }
      #map {
        height: 420px;
        width: 100%;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
      }
      .footer {
        margin-top: 2rem;
        padding: 1.25rem 0 1.5rem;
        background: #fff;
        border-top: 1px solid #e5e7eb;
      }
      .footer-content { text-align: center; }
      .tool-product-credits-footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.75rem 1.5rem;
        margin-bottom: 1rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid #e5e7eb;
      }
      .tool-product-credits-footer .credits-label {
        display: block;
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-weight: 600;
        color: #64748b;
        margin-bottom: 0.2rem;
      }
      .tool-product-credits-footer .credits-name {
        font-size: 0.95rem;
        font-weight: 600;
        color: #0f172a;
      }
      .footer-meta-line { font-size: 0.8rem; color: #64748b; }
      #statusBar { min-height: 1.5rem; }
    </style>
  </head>
  <body>
    <header class="page-header">
      <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
          <div>
            <h1 class="h4 mb-1"><i class="bi-camera-video me-2"></i>California Fire Cameras</h1>
            <p class="mb-0 small opacity-90">ALERTCalifornia fixed mounts · related to <a href="disasters-unified.html" class="text-white text-decoration-underline">Unified Disasters</a></p>
          </div>
          <div class="d-flex flex-wrap gap-2">
            <a href="disasters-unified.html" class="btn btn-light btn-sm"><i class="bi-arrow-left"></i> Unified Disasters</a>
            <button type="button" class="btn btn-warning btn-sm" id="refreshCamerasBtn"><i class="bi-arrow-repeat"></i> Refresh cameras</button>
          </div>
        </div>
      </div>
    </header>

    <main class="container pb-4">
      <div id="statusBar" class="small text-muted mb-2"></div>
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label">County</label>
          <input type="text" id="countyFilter" class="form-control form-control-sm" placeholder="e.g. Sonoma">
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button type="button" class="btn btn-primary btn-sm w-100" id="applyFilterBtn"><i class="bi-funnel"></i> Apply</button>
        </div>
        <div class="col-md-6 d-flex align-items-end justify-content-md-end">
          <span id="cameraCount" class="badge bg-secondary"></span>
        </div>
      </div>
      <div id="map" class="mb-4"></div>
      <div class="card">
        <div class="card-body">
          <table id="camerasTable" class="table table-striped table-sm w-100">
            <thead>
              <tr>
                <th>Name</th>
                <th>County</th>
                <th>State</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </main>

    <div class="modal fade" id="cameraViewerModal" tabindex="-1" aria-labelledby="cameraViewerModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-warning text-dark">
            <h5 class="modal-title" id="cameraViewerModalLabel">
              <i class="bi-camera-video"></i> <span id="cameraViewerTitle">Fire Camera</span>
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <p class="mb-1"><strong>Location:</strong> <span id="cameraViewerLocation"></span></p>
              <p class="mb-0"><strong>Site ID:</strong> <span id="cameraViewerSiteId"></span></p>
            </div>
            <div style="position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 8px; overflow: hidden;">
              <iframe id="cameraFeedFrame" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;" allowfullscreen loading="lazy"></iframe>
              <img id="cameraFeedImg" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; display: none;" alt="Camera Feed">
              <div id="cameraFeedError" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; text-align: center; display: none;">
                <i class="bi-exclamation-triangle" style="font-size: 2rem;"></i>
                <p class="mt-2">Unable to load camera feed</p>
              </div>
            </div>
            <div class="mt-3 text-center">
              <button type="button" class="btn btn-primary" id="refreshFeedImgBtn"><i class="bi-arrow-clockwise"></i> Refresh Image</button>
              <a id="cameraViewerLink" href="#" target="_blank" rel="noopener" class="btn btn-outline-primary ms-2"><i class="bi-box-arrow-up-right"></i> Open in New Tab</a>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="container">
        <div class="footer-content">
          <div class="tool-product-credits-footer" role="contentinfo" aria-label="Product credits">
            <div class="credits-block">
              <span class="credits-label">Developed by</span>
              <span class="credits-name">David E Lane</span>
            </div>
          </div>
          <div class="footer-meta-line">
            <span id="camerasFooterDate"></span>
            <span class="mx-1">·</span>
            <span>CA Fire Cameras · DevConnect Labs</span>
          </div>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDwVl1Cpi3DBIBUoCnWrLuV2oOT7mbMnNI&libraries=places"></script>
    <script src="/shared/map-icons.js"></script>
    <script src="/finance/js/ca-fire-camera-viewer.js"></script>
    <script>
      (function () {
        let map;
        let markers = [];
        let dataTable;
        let allCameras = [];

        function setStatus(msg, type) {
          const el = document.getElementById('statusBar');
          const cls = type === 'error' ? 'text-danger' : type === 'ok' ? 'text-success' : 'text-muted';
          el.className = 'small mb-2 ' + cls;
          el.textContent = msg || '';
        }

        function initMap() {
          map = new google.maps.Map(document.getElementById('map'), {
            zoom: 6,
            center: { lat: 37.2, lng: -119.5 },
            mapTypeId: 'hybrid'
          });
        }

        function renderMap(cameras) {
          markers.forEach((m) => m.setMap(null));
          markers = [];
          const bounds = new google.maps.LatLngBounds();
          let any = false;
          let idx = 0;

          cameras.forEach((r) => {
            const lat = parseFloat(r.lat);
            const lng = parseFloat(r.lng);
            if (isNaN(lat) || isNaN(lng)) return;

            const icon = window.mapIcons && window.mapIcons.getDisasterIconForMarker
              ? window.mapIcons.getDisasterIconForMarker('camera', 'alertcalifornia')
              : { url: 'https://maps.google.com/mapfiles/ms/icons/orange-dot.png', scaledSize: new google.maps.Size(24, 24) };

            const key = 'cam_' + (idx++);
            window.cameraDataStore[key] = r;

            const marker = new google.maps.Marker({
              position: { lat, lng },
              map,
              title: r.title || 'Fire Camera',
              icon,
              zIndex: 100
            });

            const info = new google.maps.InfoWindow({
              content: `<div><strong>${r.title || 'Camera'}</strong><br>${r.county_name || ''}, ${r.state_abbr || 'CA'}<br>
                <button class="btn btn-sm btn-warning mt-2" onclick="window.openCameraViewerFromMarker('${key}')">
                  <i class="bi-camera-video"></i> View Feed
                </button></div>`
            });
            marker.addListener('click', () => info.open(map, marker));
            markers.push(marker);
            bounds.extend({ lat, lng });
            any = true;
          });

          if (any) map.fitBounds(bounds);
        }

        function renderTable(cameras) {
          const tbody = document.querySelector('#camerasTable tbody');
          tbody.innerHTML = '';
          cameras.forEach((r, i) => {
            const key = 'table_' + i;
            window.cameraDataStore[key] = r;
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${(r.title || '').replace(/</g, '&lt;')}</td>
              <td>${(r.county_name || '—').replace(/</g, '&lt;')}</td>
              <td>${r.state_abbr || 'CA'}</td>
              <td>${(r.severity || r.status || '—').replace(/</g, '&lt;')}</td>
              <td><button type="button" class="btn btn-sm btn-warning" data-camera-key="${key}"><i class="bi-camera-video"></i> View</button></td>`;
            tbody.appendChild(tr);
          });

          if (dataTable) {
            dataTable.destroy();
            dataTable = null;
          }
          dataTable = $('#camerasTable').DataTable({
            pageLength: 25,
            order: [[0, 'asc']]
          });

          $('#camerasTable').off('click', 'button[data-camera-key]').on('click', 'button[data-camera-key]', function () {
            const key = $(this).data('camera-key');
            if (window.cameraDataStore[key]) window.showCameraViewer(window.cameraDataStore[key]);
          });
        }

        async function loadCameras() {
          setStatus('Loading cameras…');
          const county = (document.getElementById('countyFilter').value || '').trim();
          const qp = new URLSearchParams({ limit: '2000', state: 'CA' });
          if (county) qp.set('county', county);

          try {
            const resp = await fetch('/api/disasters/cameras?' + qp.toString());
            const json = await resp.json();
            if (!resp.ok || !json.success) {
              throw new Error(json.error || 'HTTP ' + resp.status);
            }
            allCameras = json.data.cameras || [];
            document.getElementById('cameraCount').textContent = allCameras.length + ' cameras';
            if (allCameras.length === 0) {
              setStatus('No cameras in database. Run npm run refresh:fire-cameras (or Refresh cameras on localhost).', 'error');
            } else {
              setStatus('Loaded ' + allCameras.length + ' fixed camera locations.', 'ok');
            }
            renderMap(allCameras);
            renderTable(allCameras);
          } catch (e) {
            setStatus('Failed to load cameras: ' + e.message, 'error');
          }
        }

        async function refreshCameras() {
          setStatus('Refreshing camera feed from ALERTCalifornia…');
          document.getElementById('refreshCamerasBtn').disabled = true;
          try {
            const resp = await fetch('/api/disasters/refresh-cameras', { method: 'POST' });
            const json = await resp.json();
            if (!resp.ok || !json.success) {
              throw new Error(json.error || json.details || 'HTTP ' + resp.status);
            }
            setStatus('Refresh complete. ' + (json.data?.upserted ?? json.data?.inserted ?? 0) + ' upserted.', 'ok');
            await loadCameras();
          } catch (e) {
            setStatus('Refresh failed (localhost or DISASTER_REFRESH_TOKEN required): ' + e.message, 'error');
          } finally {
            document.getElementById('refreshCamerasBtn').disabled = false;
          }
        }

        document.getElementById('applyFilterBtn').addEventListener('click', loadCameras);
        document.getElementById('refreshCamerasBtn').addEventListener('click', refreshCameras);
        document.getElementById('refreshFeedImgBtn').addEventListener('click', function () {
          const img = document.getElementById('cameraFeedImg');
          if (img && img.src) {
            img.src = img.src.split('&t=')[0].split('?t=')[0] + (img.src.includes('?') ? '&' : '?') + 't=' + Date.now();
          }
        });

        document.addEventListener('DOMContentLoaded', function () {
          document.getElementById('camerasFooterDate').textContent = new Date().toLocaleDateString();
          initMap();
          loadCameras();
        });
      })();
    </script>
    <script src="/shared/finance-auth-guard.js"></script>
  </body>
</html>
