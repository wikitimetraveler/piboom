            --ice-primary: #3498db;

        body {

        @keyframes backgroundFloat {

            50% { transform: translate(10px, -5px) scale(0.95); }

    <script>
        // Set today's date in the footer
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString();

        // Initialize voice controller
        const voiceController = new VoiceController();

        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 15;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particle.style.opacity = Math.random() * 0.5 + 0.1;
                particle.style.width = particle.style.height = (Math.random() * 6 + 2) + 'px';
                
                particlesContainer.appendChild(particle);
            }
        }

        // Initialize particles on page load
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            setActiveToolPill();
        });

        // Highlight the current tool in the pill bar
        function setActiveToolPill() {
            const current = window.location.pathname.split('/').pop();
            const links = document.querySelectorAll('#toolPillNav .nav-link');
            links.forEach(link => {
                const target = (link.getAttribute('href') || '').split('/').pop();
                if (target === current) {
                    link.classList.add('active');
                    link.setAttribute('aria-current', 'page');
                }
            });
        }

        // Utility functions
        const copyToClipboard = async (text) => {
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch (err) {
                console.error('Failed to copy text: ', err);
                return false;
            }
        };

        // Core functions
        function setParserStatus(messages = [], level = 'warning') {
            const statusEl = document.getElementById('createFieldsStatus');
            if (!statusEl) return;
            if (!messages.length) {
                statusEl.style.display = 'none';
                return;
            }
            statusEl.style.display = 'block';
            statusEl.className = `mt-2 small text-${level}`;
            statusEl.textContent = messages.join(' | ');
        }

        function parseFieldLine(line) {
            if (!line || !line.trim()) return null;
            const trimmed = line.trim();
            const parts = trimmed.includes('\t')
                ? trimmed.split('\t').map((p) => p.trim())
                : trimmed.split(/\s{2,}/).map((p) => p.trim());
            if (parts.length < 4) {
                return { error: `Skipping malformed row: "${trimmed}"` };
            }
            return {
                idRaw: parts[0] || '',
                typeRaw: parts[2] || '',
                descriptionRaw: parts[3] || '',
            };
        }

        function normalizeType(typeRaw) {
            const token = (typeRaw || '').trim();
            const t = token.toLowerCase();

            const stringMatch = t.match(/^string\s*\(\s*(\d+)\s*\)$/i);
            if (stringMatch) {
                return { format: 'string', maxLength: Number(stringMatch[1]) };
            }

            if (/^(string|text|char|varchar)$/i.test(t)) {
                return { format: 'string' };
            }

            if (/^(integer|int|long|short)$/i.test(t)) {
                return { format: 'integer' };
            }

            const decimalMatch = t.match(/^(decimal|number|numeric|double|float|currency|percent)\s*\(\s*(\d+)\s*(?:,\s*\d+\s*)?\)$/i);
            if (decimalMatch) {
                const precision = Number(decimalMatch[2]);
                if (precision === 2) return { format: 'decimal2' };
                if (precision === 3) return { format: 'decimal3' };
                if (precision === 4) return { format: 'decimal4' };
                return { format: 'decimal', warning: `Decimal precision "${precision}" mapped to decimal` };
            }

            if (/^(decimal|number|numeric|double|float|currency|percent)$/i.test(t)) {
                return { format: 'decimal' };
            }

            if (/^(date|datetime|date\/time|time)$/i.test(t)) {
                return { format: 'date' };
            }

            if (/^(boolean|bool|yes\/no|checkbox)$/i.test(t)) {
                return { format: 'boolean' };
            }

            if (/^(dropdown|enum|picklist|list|phone|ssn)$/i.test(t)) {
                return { format: 'string', warning: `Mapped "${token}" to string` };
            }

            return { format: 'string', warning: `Unknown type "${token}" mapped to string` };
        }

        function generateJSON() {
            const ruleOutput = document.getElementById('ruleOutput').value;
            if (!ruleOutput.trim()) {
                document.getElementById('ADOoutput').value = '';
                setParserStatus([]);
                return;
            }

            const rows = ruleOutput.split('\n');
            const jsonOutput = [];
            const warnings = [];
            const errors = [];

            rows.forEach((line) => {
                const parsed = parseFieldLine(line);
                if (!parsed) return;
                if (parsed.error) {
                    errors.push(parsed.error);
                    return;
                }

                const fieldId = parsed.idRaw.replace(/[\[\]]/g, '').trim().toUpperCase();
                if (!fieldId) {
                    errors.push(`Skipping row with missing field id: "${line.trim()}"`);
                    return;
                }

                const typeInfo = normalizeType(parsed.typeRaw);
                if (typeInfo.warning) warnings.push(`${fieldId}: ${typeInfo.warning}`);

                const jsonObj = {
                    id: fieldId,
                    description: parsed.descriptionRaw || '',
                    format: typeInfo.format,
                    maxLength: typeInfo.format === 'string' ? typeInfo.maxLength : undefined,
                    calculation: fieldId.startsWith('CX.R.') ? `IIf(false = true, "(F)","")` : ''
                };

                if (jsonObj.maxLength === undefined) {
                    delete jsonObj.maxLength;
                }

                jsonOutput.push(jsonObj);
            });

            document.getElementById('ADOoutput').value = JSON.stringify(jsonOutput, null, 4);

            const statusMessages = [];
            if (errors.length) statusMessages.push(`${errors.length} malformed row(s) skipped`);
            if (warnings.length) statusMessages.push(`${warnings.length} type warning(s)`);
            setParserStatus(statusMessages, errors.length ? 'danger' : (warnings.length ? 'warning' : 'success'));
        }

        function generateRules() {
            const inputParam = document.getElementById('ruleInput').value.trim();
            const appendParam = document.getElementById('appendInput').value.trim();
            const isIneligibleAudit = document.getElementById('ineligibleAudit').checked;
           
            if (!inputParam) return;

            let processedInput = inputParam;
            
            if (!processedInput.startsWith('[') && !processedInput.startsWith('CX.')) {
                processedInput = 'CX.R.' + processedInput;
            }

            processedInput = processedInput.replace(/[\[\]\s]/g, '');
            const ruleLogicLength = 'String(3)';  // R field length 3 as (F)

            const rules = [
                [`[${processedInput.toUpperCase()}]`, "New", ruleLogicLength, `${appendParam || inputParam} Logic${isIneligibleAudit ? ' - Auto Decline' : ''}`, "N"],
                [`[${processedInput.replace(".R.", ".O.").toUpperCase()}]`, "New", "String(16)", `${appendParam || inputParam} Override`, "N"],
                [`[${processedInput.replace(".R.", ".O.").toUpperCase()}.BY]`, "New", "String(128)", `${appendParam || inputParam} Override By`, "N"],
                [`[${processedInput.replace(".R.", ".O.").toUpperCase()}.DT]`, "New", "String(40)", `${appendParam || inputParam} Override Date`, "N"],
                [`[${processedInput.replace(".R.", ".O.").toUpperCase()}.RN]`, "New", "String(256)", `${appendParam || inputParam} Override Reason`, "N"]
            ];

            document.getElementById('ruleOutput').value = rules.map(rule => rule.join('\t')).join('\n');
            generateJSON();
        }

        // Event handlers
        document.addEventListener('DOMContentLoaded', function() {
            const ruleInput = document.getElementById('ruleInput');
            const appendInput = document.getElementById('appendInput');
            const ineligibleAudit = document.getElementById('ineligibleAudit');
            const ruleOutput = document.getElementById('ruleOutput');
            
            ruleInput.addEventListener('input', generateRules);
            appendInput.addEventListener('input', generateRules);
            ineligibleAudit.addEventListener('change', generateRules);
            // Support direct paste/edit flow: regenerate JSON whenever field definitions change.
            ruleOutput.addEventListener('input', generateJSON);
            ruleOutput.addEventListener('paste', () => setTimeout(generateJSON, 0));
            document.getElementById('parsePastedBtn').addEventListener('click', generateJSON);

            document.getElementById('copyJsonBtn').addEventListener('click', async () => {
                await copyToClipboard(document.getElementById('ADOoutput').value);
            });

            document.getElementById('copyRulesBtn').addEventListener('click', async () => {
                await copyToClipboard(document.getElementById('ruleOutput').value);
            });

            document.getElementById('createFieldsBtn').addEventListener('click', async () => {
                const btn = document.getElementById('createFieldsBtn');
                const statusEl = document.getElementById('createFieldsStatus');
                const jsonStr = document.getElementById('ADOoutput').value.trim();
                if (!jsonStr) {
                    statusEl.textContent = 'Generate JSON first (enter a rule name).';
                    statusEl.className = 'mt-2 small text-warning';
                    statusEl.style.display = 'block';
                    return;
                }
                let fields;
                try {
                    fields = JSON.parse(jsonStr);
                } catch (e) {
                    statusEl.textContent = 'Invalid JSON: ' + e.message;
                    statusEl.className = 'mt-2 small text-danger';
                    statusEl.style.display = 'block';
                    return;
                }
                if (!Array.isArray(fields) || fields.length === 0) {
                    statusEl.textContent = 'JSON must be a non-empty array of field definitions.';
                    statusEl.className = 'mt-2 small text-warning';
                    statusEl.style.display = 'block';
                    return;
                }
                btn.disabled = true;
                statusEl.textContent = 'Creating fields in Encompass...';
                statusEl.className = 'mt-2 small text-info';
                statusEl.style.display = 'block';
                try {
                    const res = await (window.encompassApi?.encompassFetch || fetch)('/api/encompass-hub/create-fields', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(fields),
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        statusEl.textContent = (data.error || 'Request failed') + ': ' + (data.details || res.status);
                        statusEl.className = 'mt-2 small text-danger';
                        return;
                    }
                    const { created, failed } = data;
                    if (failed && failed.length > 0) {
                        statusEl.innerHTML = `Created ${created} field(s). Failed: ${failed.map(f => f.id + ': ' + f.error).join('; ')}`;
                        statusEl.className = 'mt-2 small text-warning';
                    } else {
                        statusEl.textContent = `Successfully created ${created} field(s) in Encompass.`;
                        statusEl.className = 'mt-2 small text-success';
                    }
                } catch (err) {
                    statusEl.textContent = 'Error: ' + err.message;
                    statusEl.className = 'mt-2 small text-danger';
                } finally {
                    btn.disabled = false;
                }
            });

            // Add voice commands for automator
            if (typeof voiceController !== 'undefined') {
                // Override the processCommand method to add automator-specific commands
                const originalProcessCommand = voiceController.processCommand.bind(voiceController);
                voiceController.processCommand = function(command) {
                    console.log('Automator voice command received:', command);
                    
                    // Automator-specific commands
                    if (command.includes('generate rules') || command.includes('create rules')) {
                        voiceController.speak('Generating automation rules');
                        generateRules();
                        return;
                    }
                    
                    if (command.includes('copy json') || command.includes('copy generated json')) {
                        voiceController.speak('Copying JSON to clipboard');
                        copyToClipboard(document.getElementById('ADOoutput').value);
                        return;
                    }
                    
                    if (command.includes('copy rules') || command.includes('copy field definitions')) {
                        voiceController.speak('Copying field definitions to clipboard');
                        copyToClipboard(document.getElementById('ruleOutput').value);
                        return;
                    }
                    
                    if (command.includes('clear all') || command.includes('clear fields')) {
                        voiceController.speak('Clearing all fields');
                        document.getElementById('ruleInput').value = '';
                        document.getElementById('appendInput').value = '';
                        document.getElementById('ineligibleAudit').checked = false;
                        document.getElementById('ruleOutput').value = '';
                        document.getElementById('ADOoutput').value = '';
                        return;
                    }
                    
                    if (command.includes('go home') || command.includes('back to menu')) {
                        voiceController.speak('Navigating to home page');
                        window.location.href = '../../index.html';
                        return;
                    }
                    
                    // Call the original processCommand for other commands
                    originalProcessCommand.call(this, command);
                };
            }
        });

        // Make voice controller globally accessible for debugging
        window.voiceController = voiceController;
    </script>
  <script src="/shared/encompass-api.js"></script>
  <script src="/shared/tts.js"></script>
  <script src="/shared/finance-auth-guard.js"></script>
  </body>
