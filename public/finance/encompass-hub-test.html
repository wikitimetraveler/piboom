<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Encompass Hub – Test Console</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/shared/styles.css" />
    <script src="/shared/modern-navbar.js" defer></script>
    <style>
      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #f4f7fb 0%, #e3ecff 55%, #f9fbff 100%);
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        color: #1a2856;
      }

      .page-shell {
        padding: 4.5rem 1rem 3rem;
      }

      .test-card {
        border-radius: 18px;
        border: 1px solid rgba(99, 112, 189, 0.18);
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 24px 60px rgba(13, 32, 83, 0.12);
      }

      .endpoint-badges span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        background: rgba(102, 126, 234, 0.1);
        border: 1px solid rgba(99, 112, 189, 0.2);
        font-size: 0.8rem;
        margin: 0.2rem 0.2rem 0;
        color: #1a2856;
      }

      pre#responseBody {
        background: #0f172a;
        color: #e2e8f0;
        border-radius: 14px;
        padding: 1rem;
        max-height: 420px;
        overflow: auto;
      }
    </style>
  </head>
  <body data-page="encompass-hub-test">
    <modern-navbar></modern-navbar>

    <main class="page-shell">
      <div class="container">
        <div class="d-flex justify-content-between align-items-center flex-wrap mb-4">
          <div>
            <span class="badge badge-pill badge-light"><i class="bi-clipboard-data"></i> Encompass Test Console</span>
            <h1 class="mt-3 mb-2">Run Live Endpoint Checks</h1>
            <p class="text-muted mb-0">
              Trigger the Encompass Hub API endpoints and inspect raw JSON without leaving the browser.
            </p>
          </div>
          <div class="mt-3 mt-md-0 d-flex flex-wrap" style="gap: 0.5rem;">
            <a class="btn btn-outline-primary" href="encompass-hub.html">
              <i class="bi-arrow-left"></i> Back to Hub
            </a>
            <a class="btn btn-outline-secondary" href="unit-tests.html">
              <i class="bi-check2-circle"></i> Unit Test Runner
            </a>
          </div>
        </div>

        <div class="row">
          <div class="col-lg-4 mb-4">
            <div class="test-card p-4 h-100">
              <h5 class="mb-3">Endpoint Runner</h5>
              <form id="testForm">
                <div class="form-group">
                  <label for="endpointSelect">Endpoint</label>
                  <select id="endpointSelect" class="form-control"></select>
                </div>
                <div class="form-group">
                  <label for="stateInput">State</label>
                  <input type="text" class="form-control" id="stateInput" placeholder="CA" />
                </div>
                <div class="form-group">
                  <label for="countyInput">Counties</label>
                  <input type="text" class="form-control" id="countyInput" placeholder="Los Angeles, Orange" />
                </div>
                <div class="form-group">
                  <label for="limitInput">Limit</label>
                  <input type="number" min="1" max="200" class="form-control" id="limitInput" value="10" />
                </div>
                <div class="form-group">
                  <label for="loanGuidInput">Loan GUID</label>
                  <input type="text" class="form-control" id="loanGuidInput" placeholder="Paste a loan GUID" />
                  <small class="form-text text-muted">Required for loan detail calls.</small>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                  <i class="bi-play-fill"></i> Run Test
                </button>
              </form>

              <div class="mt-4">
                <h6 class="text-muted text-uppercase">Quick Picks</h6>
                <div class="endpoint-badges" id="quickButtons"></div>
              </div>
            </div>
          </div>

          <div class="col-lg-8 mb-4">
            <div class="test-card p-4">
              <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
                <div>
                  <h5 class="mb-1">Response</h5>
                  <small class="text-muted" id="responseMeta">Waiting for a request...</small>
                </div>
                <button class="btn btn-outline-secondary btn-sm" id="copyBtn">
                  <i class="bi-clipboard"></i> Copy JSON
                </button>
              </div>
              <pre id="responseBody">{}</pre>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="/shared/dark-mode.js"></script>
    <script src="js/encompassHubTest.js" type="module"></script>
    <script src="/shared/finance-auth-guard.js"></script>
  </body>
</html>
