<!DOCTYPE html>
<!-- Development work by David Lane -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worksheets — David Lane · LOS AI Labs</title>
  <meta name="description" content="Encompass tools, FHA/VA calculators, disaster maps, and developer utilities — Worksheets hub by David Lane."/>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/shared/design-tokens.css">
  <link rel="stylesheet" href="/shared/css/portfolio-shell.css">
  <script src="/shared/menu-config.js"></script>
  <script src="/shared/site-portfolio.js"></script>
</head>
<body class="portfolio-page portfolio-finance-hub" data-portfolio-page="finance">

<header class="portfolio-header">
  <a class="portfolio-brand" href="/">
    <span class="portfolio-brand__name">David Lane</span>
    <span class="portfolio-brand__sub">LOS AI Labs</span>
  </a>
  <nav class="portfolio-nav" id="portfolioNav" aria-label="Primary"></nav>
  <div class="portfolio-header__actions">
    <a class="portfolio-btn portfolio-btn--outline portfolio-header__back" href="/work.html">Portfolio</a>
    <button type="button" class="portfolio-theme-btn" id="portfolioThemeToggle" aria-label="Toggle theme">AUTO</button>
  </div>
</header>

<main class="portfolio-main">
  <section class="portfolio-section">
    <p class="portfolio-kicker">Worksheets</p>
    <h1 class="portfolio-section__title">Mortgage calculators &amp; Encompass tools</h1>
    <p class="portfolio-section__lead">FHA and VA worksheets, ICE-integrated hubs, disaster intelligence, and developer utilities. Some tools require finance login on this host.</p>
    <div class="portfolio-finance-grid" id="financeToolGrid" aria-label="Finance tools"></div>
  </section>
</main>

<footer class="portfolio-footer">
  David Lane · <span data-platform-name>LOS AI Labs</span> · <span id="portfolioYear"></span>
  · <a href="/">Portfolio home</a>
</footer>

<script src="/shared/demo-users.js"></script>
<script src="/shared/user-login.js"></script>
<script src="/shared/user-passwords.js"></script>
<script src="/shared/dark-mode.js"></script>
<script src="/shared/js/portfolio-shell.js"></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
  function renderFinanceTools() {
    const grid = document.getElementById('financeToolGrid');
    if (!grid || !window.MENU_CONFIG) return;
    const loggedIn = typeof window.isLoggedIn === 'function' && window.isLoggedIn();
    const tools = typeof window.MENU_CONFIG.getMortgageTools === 'function'
      ? window.MENU_CONFIG.getMortgageTools(loggedIn)
      : (window.MENU_CONFIG.filterToolsByAuth
        ? window.MENU_CONFIG.filterToolsByAuth(window.MENU_CONFIG.FINANCE_TOOLS || [], loggedIn)
        : (window.MENU_CONFIG.FINANCE_TOOLS || []));
    grid.innerHTML = tools.map(function (item) {
      const title = (item.title || item.label || '').replace(/"/g, '&quot;');
      const label = (item.label || '').replace(/"/g, '&quot;');
      const icon = item.icon || 'bi-box';
      const href = item.href || '#';
      return (
        '<a class="portfolio-finance-tile" href="' + href + '" title="' + title + '">' +
        '<i class="bi ' + icon + '" aria-hidden="true"></i>' +
        '<span>' + label + '</span></a>'
      );
    }).join('');
  }
  window.renderFinanceTools = renderFinanceTools;
  renderFinanceTools();
  window.addEventListener('user-logged-in', renderFinanceTools);
});
</script>
<script src="/shared/finance-auth-guard.js"></script>
</body>
</html>
