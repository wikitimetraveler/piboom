<!DOCTYPE html>
<!-- Development work by David Lane -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HeyGen Video Library — DevConnect Labs</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/shared/design-tokens.css" />
  <link rel="stylesheet" href="/shared/modern-navbar.css" />
  <link rel="stylesheet" href="/finance/css/heygen-library.css" />
  <script type="module" src="/shared/modern-navbar.js"></script>
</head>
<body class="hvl-page">
  <modern-navbar></modern-navbar>
  <main class="hvl-wrap">
    <header>
      <p class="hvl-kicker">HeyGen · DevConnect Labs</p>
      <h1 class="hvl-title">Video library</h1>
      <p class="hvl-lede">
        All generated avatar videos in one place — Lane legacy lines, Unified Disasters studio renders,
        and anything queued through <code>/api/heygen/videos</code>.
      </p>
    </header>

    <div class="hvl-toolbar">
      <button type="button" class="btn btn-sm btn-primary hvl-filter active" data-domain="">All</button>
      <button type="button" class="btn btn-sm btn-outline-primary hvl-filter" data-domain="lane">Lane</button>
      <button type="button" class="btn btn-sm btn-outline-primary hvl-filter" data-domain="disasters">Disasters</button>
      <button type="button" class="btn btn-sm btn-outline-secondary" id="hvlRefreshBtn">
        <i class="bi bi-arrow-repeat"></i> Refresh
      </button>
      <a class="btn btn-sm btn-outline-dark" href="/finance/disasters-unified.html#duHeygenPullCard">
        <i class="bi bi-camera-reels"></i> Disaster studio
      </a>
      <a class="btn btn-sm btn-outline-dark" href="/family/lane-heygen-print.html">
        <i class="bi bi-printer"></i> Lane print kit
      </a>
    </div>

    <p class="small text-muted mb-2" id="hvlStatus" role="status" aria-live="polite"></p>
    <div class="hvl-grid" id="hvlGrid" aria-live="polite"></div>

    <footer class="hvl-credits">
      Development by David E Lane · Avatar narration powered by
      <a href="https://www.heygen.com" target="_blank" rel="noopener noreferrer">HeyGen</a>
    </footer>
  </main>

  <script src="/finance/js/heygen-library.js"></script>
</body>
</html>
