<!DOCTYPE html>
<!-- Development work by David Lane -->
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazard Webcams · National Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { background: #f5f7fa; font-family: 'Inter', 'Segoe UI', sans-serif; min-height: 100vh; }
      .page-header {
        background: linear-gradient(135deg, #1e3a5f, #2980b9);
        color: #fff;
        padding: 1.25rem 0;
        margin-bottom: 1.5rem;
      }
      #map { height: 420px; width: 100%; border-radius: 8px; border: 1px solid #e5e7eb; }
      .source-stat { font-size: 0.85rem; }
      .hazard-chip.active { background: #2980b9; color: #fff; border-color: #2980b9; }
      #statusBar { min-height: 1.5rem; }
    </style>
  </head>
  <body>
    <header class="page-header">
      <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
          <div>
            <h1 class="h4 mb-1"><i class="bi-camera-video me-2"></i>Hazard Webcams</h1>
            <p class="mb-0 small opacity-90">USGS · NOAA WebCOOS · ALERTCalifornia · UCSD — <a href="disasters-unified.html" class="text-white text-decoration-underline">Unified Disasters</a></p>
          </div>
          <div class="d-flex flex-wrap gap-2">
            <a href="disasters-unified.html" class="btn btn-light btn-sm"><i class="bi-arrow-left"></i> Unified Disasters</a>
            <button type="button" class="btn btn-warning btn-sm" id="refreshCamerasBtn"><i class="bi-arrow-repeat"></i> Refresh all sources</button>
          </div>
        </div>
      </div>
    </header>

    <main class="container pb-4">
      <div id="statusBar" class="small text-muted mb-2"></div>
      <div id="sourceStatsRow" class="d-flex flex-wrap gap-2 mb-3"></div>

      <div class="row g-3 mb-3">
        <div class="col-md-3">
          <label class="form-label">Source</label>
          <select id="sourceFilter" class="form-select form-select-sm">
            <option value="">All sources</option>
            <option value="alertcalifornia">ALERTCalifornia</option>
            <option value="usgs_nims">USGS (rivers / hydrology)</option>
            <option value="usgs_volcano">USGS Volcano</option>
            <option value="webcoos">NOAA WebCOOS (coastal)</option>
            <option value="ucsd_pier">UCSD Scripps Pier</option>
            <option value="ucsd_hpwren">UCSD HPWREN</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">State</label>
          <input type="text" id="stateFilter" class="form-control form-control-sm" placeholder="e.g. CA" maxlength="3">
        </div>
        <div class="col-md-3">
          <label class="form-label">County</label>
          <input type="text" id="countyFilter" class="form-control form-control-sm" placeholder="optional">
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button type="button" class="btn btn-primary btn-sm w-100" id="applyFilterBtn"><i class="bi-funnel"></i> Apply</button>
        </div>
        <div class="col-md-2 d-flex align-items-end justify-content-md-end">
          <span id="cameraCount" class="badge bg-secondary"></span>
        </div>
      </div>

      <div class="mb-3 d-flex flex-wrap gap-2" id="hazardChips">
        <span class="text-muted small align-self-center me-1">Hazard:</span>
        <button type="button" class="btn btn-sm btn-outline-secondary hazard-chip active" data-hazard="">All</button>
        <button type="button" class="btn btn-sm btn-outline-secondary hazard-chip" data-hazard="coastal">Coastal</button>
        <button type="button" class="btn btn-sm btn-outline-secondary hazard-chip" data-hazard="river">River</button>
        <button type="button" class="btn btn-sm btn-outline-secondary hazard-chip" data-hazard="fire">Fire</button>
        <button type="button" class="btn btn-sm btn-outline-secondary hazard-chip" data-hazard="volcano">Volcano</button>
        <button type="button" class="btn btn-sm btn-outline-secondary hazard-chip" data-hazard="flood">Flood</button>
      </div>

      <div id="map" class="mb-4"></div>
      <div class="card">
        <div class="card-body">
          <table id="camerasTable" class="table table-striped table-sm w-100">
            <thead>
              <tr>
                <th>Name</th>
                <th>Source</th>
                <th>County</th>
                <th>State</th>
                <th>Media</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </main>

    <div class="modal fade" id="cameraViewerModal" tabindex="-1" aria-labelledby="cameraViewerModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-warning text-dark">
            <h5 class="modal-title" id="cameraViewerModalLabel">
              <i class="bi-camera-video"></i> <span id="cameraViewerTitle">Webcam</span>
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <p class="mb-1"><strong>Location:</strong> <span id="cameraViewerLocation"></span></p>
              <p class="mb-1"><strong>Mount:</strong> <span id="cameraViewerSiteId"></span></p>
              <p class="mb-0 small text-muted" id="cameraViewerAttribution"></p>
            </div>
            <div style="position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 8px; overflow: hidden;">
              <iframe id="cameraFeedFrame" style="position: absolute; inset: 0; width: 100%; height: 100%; border: none;" allowfullscreen loading="lazy"></iframe>
              <img id="cameraFeedImg" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: none;" alt="Camera still">
              <div id="cameraFeedError" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; text-align: center; display: none;">
                <i class="bi-exclamation-triangle" style="font-size: 2rem;"></i>
                <p class="mt-2">Unable to load camera feed</p>
              </div>
            </div>
            <div class="mt-3 text-center">
              <button type="button" class="btn btn-primary" id="refreshFeedImgBtn"><i class="bi-arrow-clockwise"></i> Refresh image</button>
              <a id="cameraViewerLink" href="#" target="_blank" rel="noopener" class="btn btn-outline-primary ms-2"><i class="bi-box-arrow-up-right"></i> Open source page</a>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDwVl1Cpi3DBIBUoCnWrLuV2oOT7mbMnNI&libraries=places"></script>
    <script src="/shared/map-icons.js"></script>
    <script src="/finance/js/hazard-webcam-viewer.js"></script>
    <script>
      (function () {
        let map, markers = [], dataTable, allCameras = [], selectedHazard = '';
        let lastFilterKey = '';
        let filterDebounceTimer = null;

        function currentFilterKey() {
          return [
            document.getElementById('sourceFilter').value,
            (document.getElementById('stateFilter').value || '').trim(),
            (document.getElementById('countyFilter').value || '').trim(),
            selectedHazard
          ].join('|');
        }

        function rememberFilterKey() {
          lastFilterKey = currentFilterKey();
        }

        function loadCamerasIfFiltersChanged() {
          const key = currentFilterKey();
          if (key === lastFilterKey) return;
          loadCameras();
        }

        function scheduleFilterReload() {
          clearTimeout(filterDebounceTimer);
          filterDebounceTimer = setTimeout(loadCamerasIfFiltersChanged, 350);
        }

        function reloadFiltersNow() {
          clearTimeout(filterDebounceTimer);
          loadCamerasIfFiltersChanged();
        }

        function setStatus(msg, type) {
          const el = document.getElementById('statusBar');
          el.className = 'small mb-2 ' + (type === 'error' ? 'text-danger' : type === 'ok' ? 'text-success' : 'text-muted');
          el.textContent = msg || '';
        }

        function initMap() {
          map = new google.maps.Map(document.getElementById('map'), {
            zoom: 4,
            center: { lat: 39.5, lng: -98.35 },
            mapTypeId: 'hybrid'
          });
        }

        async function loadStats() {
          try {
            const resp = await fetch('/api/disasters/cameras/stats');
            const json = await resp.json();
            if (!json.success) return;
            const row = document.getElementById('sourceStatsRow');
            row.innerHTML = (json.data.bySource || []).map((s) =>
              `<span class="badge bg-light text-dark border source-stat">${s.source}: ${s.count}</span>`
            ).join('') + `<span class="badge bg-primary source-stat">Total: ${json.data.total || 0}</span>`;
          } catch (_) {}
        }

        function renderMap(cameras) {
          markers.forEach((m) => m.setMap(null));
          markers = [];
          const bounds = new google.maps.LatLngBounds();
          let any = false;
          cameras.forEach((r, idx) => {
            const lat = parseFloat(r.lat);
            const lng = parseFloat(r.lng);
            if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
            const icon = window.mapIcons?.getDisasterIconForMarker
              ? window.mapIcons.getDisasterIconForMarker('camera', r.source || 'alertcalifornia')
              : undefined;
            const key = 'cam_' + idx;
            window.cameraDataStore[key] = r;
            const marker = new google.maps.Marker({ position: { lat, lng }, map, title: r.title, icon, zIndex: 100 });
            const info = new google.maps.InfoWindow({
              content: `<div><strong>${(r.title || '').replace(/</g, '&lt;')}</strong><br><small>${r.source || ''}</small><br>
                <button class="btn btn-sm btn-warning mt-2" onclick="openCameraViewerFromMarker('${key}')">View</button></div>`
            });
            marker.addListener('click', () => info.open(map, marker));
            markers.push(marker);
            bounds.extend({ lat, lng });
            any = true;
          });
          if (any) map.fitBounds(bounds);
        }

        function renderTable(cameras) {
          const tbody = document.querySelector('#camerasTable tbody');
          tbody.innerHTML = '';
          cameras.forEach((r, i) => {
            const key = 'table_' + i;
            window.cameraDataStore[key] = r;
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${(r.title || '').replace(/</g, '&lt;')}</td>
              <td>${(r.source || '').replace(/</g, '&lt;')}</td>
              <td>${(r.county_name || '—').replace(/</g, '&lt;')}</td>
              <td>${r.state_abbr || '—'}</td>
              <td>${(r.media_type || '—').replace(/</g, '&lt;')}</td>
              <td><button type="button" class="btn btn-sm btn-warning" data-camera-key="${key}"><i class="bi-camera-video"></i></button></td>`;
            tbody.appendChild(tr);
          });
          if (dataTable) { dataTable.destroy(); dataTable = null; }
          dataTable = $('#camerasTable').DataTable({ pageLength: 25, order: [[0, 'asc']] });
          $('#camerasTable').off('click', 'button[data-camera-key]').on('click', 'button[data-camera-key]', function () {
            const key = $(this).data('camera-key');
            if (window.cameraDataStore[key]) window.showCameraViewer(window.cameraDataStore[key]);
          });
        }

        async function loadCameras() {
          setStatus('Loading webcams…');
          const qp = new URLSearchParams({ limit: '5000' });
          const source = document.getElementById('sourceFilter').value;
          const state = (document.getElementById('stateFilter').value || '').trim();
          const county = (document.getElementById('countyFilter').value || '').trim();
          if (source) qp.set('source', source);
          if (state) qp.set('state', state.toUpperCase());
          if (county) qp.set('county', county);
          if (selectedHazard) qp.set('hazard', selectedHazard);

          try {
            const resp = await fetch('/api/disasters/cameras?' + qp.toString());
            const json = await resp.json();
            if (!resp.ok || !json.success) throw new Error(json.error || 'HTTP ' + resp.status);
            allCameras = json.data.cameras || [];
            document.getElementById('cameraCount').textContent = allCameras.length + ' shown · ' + (json.data.total || allCameras.length) + ' total';
            setStatus(allCameras.length ? 'Loaded ' + allCameras.length + ' mounts.' : 'No cameras — run npm run refresh:hazard-webcams', allCameras.length ? 'ok' : 'error');
            renderMap(allCameras);
            renderTable(allCameras);
            await loadStats();
            rememberFilterKey();
          } catch (e) {
            setStatus('Failed: ' + e.message, 'error');
          }
        }

        async function refreshCameras() {
          setStatus('Refreshing all hazard webcam sources (may take several minutes)…');
          document.getElementById('refreshCamerasBtn').disabled = true;
          try {
            const resp = await fetch('/api/disasters/refresh-cameras?sources=all', { method: 'POST' });
            const json = await resp.json();
            if (!resp.ok || !json.success) throw new Error(json.error || json.details || 'HTTP ' + resp.status);
            setStatus('Refresh complete.', 'ok');
            await loadCameras();
          } catch (e) {
            setStatus('Refresh failed (localhost or DISASTER_REFRESH_TOKEN): ' + e.message, 'error');
          } finally {
            document.getElementById('refreshCamerasBtn').disabled = false;
          }
        }

        document.querySelectorAll('.hazard-chip').forEach((btn) => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.hazard-chip').forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            selectedHazard = btn.dataset.hazard || '';
            loadCamerasIfFiltersChanged();
          });
        });
        document.getElementById('sourceFilter').addEventListener('change', loadCamerasIfFiltersChanged);
        document.getElementById('stateFilter').addEventListener('input', scheduleFilterReload);
        document.getElementById('countyFilter').addEventListener('input', scheduleFilterReload);
        ['stateFilter', 'countyFilter'].forEach((id) => {
          document.getElementById(id).addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
              event.preventDefault();
              reloadFiltersNow();
            }
          });
        });
        document.getElementById('applyFilterBtn').addEventListener('click', loadCameras);
        document.getElementById('refreshCamerasBtn').addEventListener('click', refreshCameras);
        document.addEventListener('DOMContentLoaded', () => { initMap(); loadCameras(); });
      })();
    </script>
    <script src="/shared/finance-auth-guard.js"></script>
  </body>
</html>
