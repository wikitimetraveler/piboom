    <script>
        // Voice Control System
        class VoiceController {
            constructor() {
                this.recognition = null;
                this.synthesis = window.speechSynthesis;
                this.isListening = false;
                this.voiceBtn = document.getElementById('voiceBtn');
                this.voiceStatus = document.getElementById('voiceStatus');
                
                this.init();
            }
            
            init() {
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    this.recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                    this.setupRecognition();
                    this.setupEventListeners();
                } else {
                    this.voiceStatus.textContent = 'Voice not supported';
                    this.voiceBtn.disabled = true;
                    this.voiceBtn.style.opacity = '0.5';
                }
            }
            
            setupRecognition() {
                this.recognition.continuous = false;
                this.recognition.interimResults = false;
                this.recognition.lang = 'en-US';
                
                this.recognition.onstart = () => {
                    this.isListening = true;
                    this.voiceBtn.classList.add('listening');
                    this.voiceBtn.innerHTML = '<i class="bi-mic-mute"></i>';
                    this.updateStatus('Listening...', true);
                };
                
                this.recognition.onresult = (event) => {
                    const command = event.results[0][0].transcript.toLowerCase();
                    this.processCommand(command);
                };
                
                this.recognition.onerror = (event) => {
                    console.error('Speech recognition error:', event.error);
                    this.updateStatus('Error: ' + event.error, false);
                    this.stopListening();
                };
                
                this.recognition.onend = () => {
                    this.stopListening();
                };
            }
            
            setupEventListeners() {
                this.voiceBtn.addEventListener('click', () => {
                    if (this.isListening) {
                        this.stopListening();
                    } else {
                        this.startListening();
                    }
                });
                
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey && e.key === 'v') {
                        e.preventDefault();
                        if (this.isListening) {
                            this.stopListening();
                        } else {
                            this.startListening();
                        }
                    }
                });
            }
            
            startListening() {
                try {
                    this.recognition.start();
                } catch (error) {
                    console.error('Error starting speech recognition:', error);
                    this.updateStatus('Error starting voice control', false);
                }
            }
            
            stopListening() {
                this.isListening = false;
                this.voiceBtn.classList.remove('listening');
                this.voiceBtn.innerHTML = '<i class="bi-mic"></i>';
                this.updateStatus('Click to start voice control');
                
                try {
                    this.recognition.stop();
                } catch (error) {
                    console.error('Error stopping speech recognition:', error);
                }
            }
            
            updateStatus(message, isListening = false) {
                this.voiceStatus.textContent = message;
                this.voiceStatus.classList.toggle('show', true);
                this.voiceStatus.classList.toggle('listening', isListening);
                
                setTimeout(() => {
                    this.voiceStatus.classList.remove('show');
                }, 3000);
            }
            
            processCommand(command) {
                console.log('Voice command received:', command);
                
                if (command.includes('parse') || command.includes('validate')) {
                    this.speak('Parsing JSON data');
                    parseJson();
                    return;
                }
                
                if (command.includes('clear') || command.includes('reset')) {
                    this.speak('Clearing form');
                    document.getElementById('jsonData').value = '';
                    document.getElementById('validJsonSection').style.display = 'none';
                    document.getElementById('invalidJsonSection').style.display = 'none';
                    return;
                }
                
                if (command.includes('go home') || command.includes('back to menu')) {
                    this.speak('Navigating to home page');
                    window.location.href = '../../index.html';
                    return;
                }
                
                this.speak('Command not recognized. Try saying "parse" or "clear"');
                this.updateStatus('Command not recognized');
            }
            
            speak(text) {
                if (this.synthesis) {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.rate = 0.9;
                    utterance.pitch = 1;
                    this.synthesis.speak(utterance);
                }
            }
        }

        // Set today's date in the footer

        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 15;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particle.style.opacity = Math.random() * 0.5 + 0.1;
                particle.style.width = particle.style.height = (Math.random() * 6 + 2) + 'px';
                
                particlesContainer.appendChild(particle);
            }
        }

        // Initialize particles on page load
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            setActiveToolPill();
        });

        // Highlight the current tool in the pill bar
        function setActiveToolPill() {
            const current = window.location.pathname.split('/').pop();
            const links = document.querySelectorAll('#toolPillNav .nav-link');
            links.forEach(link => {
                const target = (link.getAttribute('href') || '').split('/').pop();
                if (target === current) {
                    link.classList.add('active');
                    link.setAttribute('aria-current', 'page');
                }
            });
        }

        // JSON Parsing Functions
        function parseJson() {
            var jsonData = document.getElementById('jsonData').value.trim();
            var validJsonContainer = document.getElementById('validJson');
            var invalidJsonContainer = document.getElementById('invalidJson');
            var validSection = document.getElementById('validJsonSection');
            var invalidSection = document.getElementById('invalidJsonSection');
            
            // Clear previous contents
            validJsonContainer.innerHTML = '';
            invalidJsonContainer.innerHTML = '';
            validSection.style.display = 'none';
            invalidSection.style.display = 'none';
            
            if (!jsonData) {
                voiceController.speak('Please enter JSON data to parse');
                return;
            }
            
            // Regular expression to match JSON objects
            var jsonRegex = /(\{[^{}]*\}|\[[^\[\]]*\])/g;
            var matches = jsonData.match(jsonRegex);

            if (matches) {
                matches.forEach(function (match, index) {
                    try {
                        // Skip objects that start with '[' followed by an alphanumeric character
                        if (match.trim().startsWith('[') && /^[a-zA-Z0-9]/.test(match.trim()[1])) {
                            return;
                        }

                        // Replace "" with "
                        match = match.replace(/""/g, '"');

                        var jsonObject = JSON.parse(match);
                        var jsonArray = [jsonObject]; // Wrap the object in an array

                        // Iterate through array of objects
                        jsonArray.forEach(function (jsonObject, index) {
                            var jsonText = JSON.stringify(jsonObject, null, 4);
                            
                            // Create container for valid JSON
                            var validJsonContainerDiv = document.createElement('div');
                            validJsonContainerDiv.classList.add('json-result', 'valid', 'mb-3');

                            // Display JSON object as text
                            var jsonTextarea = document.createElement('textarea');
                            jsonTextarea.value = jsonText;
                            jsonTextarea.classList.add('json-textarea');
                            jsonTextarea.readOnly = true;
                            validJsonContainerDiv.appendChild(jsonTextarea);
                            
                            // Iterate through keys in the JSON object and display recursively
                            displayKeysAndValues(jsonObject, validJsonContainerDiv);

                            // Append container to valid JSON container
                            validJsonContainer.appendChild(validJsonContainerDiv);
                        });

                        validSection.style.display = 'block';

                    } catch (error) {
                        var invalidTextarea = document.createElement('textarea');
                        invalidTextarea.value = match;
                        invalidTextarea.classList.add('json-textarea', 'mb-3');
                        invalidJsonContainer.appendChild(invalidTextarea);
                        invalidSection.style.display = 'block';
                    }
                });

                // Scroll to results
                validSection.scrollIntoView({ behavior: 'smooth' });
                invalidSection.scrollIntoView({ behavior: 'smooth' });
                
                voiceController.speak('JSON parsing completed');
            } else {
                // If no JSON objects found, display a message
                invalidJsonContainer.innerHTML = "<p>No JSON objects found in the input.</p>";
                invalidSection.style.display = 'block';
                voiceController.speak('No JSON objects found in the input');
            }

            // Scroll to top of page
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Function to recursively display keys and values
        function displayKeysAndValues(jsonObject, container) {
            if (Array.isArray(jsonObject)) {
                // If JSON data is an array of objects
                for (var i = 0; i < jsonObject.length; i++) {
                    var obj = jsonObject[i];
                    displayKeysAndValuesForObject(obj, container);
                }
            } else {
                // If JSON data is a single object
                displayKeysAndValuesForObject(jsonObject, container);
            }
        }

        function displayKeysAndValuesForObject(obj, container) {
            for (var key in obj) {
                if (obj.hasOwnProperty(key) && ['FieldID', 'UserFID', 'TimeFID', 'ReasonFID'].includes(key)) {
                    // Remove square brackets if they are at the beginning and end of the value
                    var value = obj[key].replace(/^\[|\]$/g, '');

                    // Create label
                    var label = document.createElement('label');
                    label.textContent = value;
                    label.className = 'form-label mt-3';

                    // Create textarea
                    var textarea = document.createElement('textarea');
                    textarea.setAttribute('id', value);
                    textarea.setAttribute('emid', value);
                    textarea.setAttribute('class', 'form-control json-textarea');
                    textarea.value = value;
                    textarea.style.minHeight = '100px';

                    // Append label and textarea to container
                    container.appendChild(label);
                    container.appendChild(textarea);
                }
            }
        }

        // Make voice controller globally accessible for debugging
        window.voiceController = voiceController;
    </script>
