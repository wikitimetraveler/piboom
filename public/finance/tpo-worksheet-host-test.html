<!DOCTYPE html>
<!-- Development work by David Lane -->
<!-- Local harness: launches the TPO worksheet guest in an iframe (no TPO needed). -->
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Guest iframe launcher · TPO test</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
  <main class="container py-3">
    <h1 class="fs-4">Guest iframe launcher</h1>
    <p class="small text-muted">Loads the worksheet guest below. The guest shows demo data until hosted in TPO Connect.</p>
    <form class="row g-2 align-items-end mb-3" id="hostForm">
      <div class="col-md-8">
        <label class="form-label small" for="hostUrl">Guest URL</label>
        <input class="form-control form-control-sm" id="hostUrl" value="/finance/tpo-worksheet-guest.html?demo=1"/>
      </div>
      <div class="col-md-4">
        <button type="submit" class="btn btn-sm btn-primary w-100">Launch iframe</button>
      </div>
    </form>
    <div class="ratio ratio-16x9 border rounded overflow-hidden">
      <iframe id="hostFrame" title="Worksheet guest" src="/finance/tpo-worksheet-guest.html?demo=1"></iframe>
    </div>
  </main>
  <script>
    (function () {
      'use strict';
      var form = document.getElementById('hostForm');
      var url = document.getElementById('hostUrl');
      var frame = document.getElementById('hostFrame');
      if (form) form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        if (frame && url && url.value) frame.src = url.value;
      });
    })();
  </script>
</body>
</html>
