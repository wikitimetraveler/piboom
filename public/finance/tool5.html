    <script>
        // Voice Control System
        class VoiceController {
            constructor() {
                this.recognition = null;
                this.synthesis = window.speechSynthesis;
                this.isListening = false;
                this.voiceBtn = document.getElementById('voiceBtn');
                this.voiceStatus = document.getElementById('voiceStatus');
                
                this.init();
            }
            
            init() {
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    this.recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                    this.setupRecognition();
                    this.setupEventListeners();
                } else {
                    this.voiceStatus.textContent = 'Voice not supported';
                    this.voiceBtn.disabled = true;
                    this.voiceBtn.style.opacity = '0.5';
                }
            }
            
            setupRecognition() {
                this.recognition.continuous = false;
                this.recognition.interimResults = false;
                this.recognition.lang = 'en-US';
                
                this.recognition.onstart = () => {
                    this.isListening = true;
                    this.voiceBtn.classList.add('listening');
                    this.voiceBtn.innerHTML = '<i class="bi-mic-mute"></i>';
                    this.updateStatus('Listening...', true);
                };
                
                this.recognition.onresult = (event) => {
                    const command = event.results[0][0].transcript.toLowerCase();
                    this.processCommand(command);
                };
                
                this.recognition.onerror = (event) => {
                    console.error('Speech recognition error:', event.error);
                    this.updateStatus('Error: ' + event.error, false);
                    this.stopListening();
                };
                
                this.recognition.onend = () => {
                    this.stopListening();
                };
            }
            
            setupEventListeners() {
                this.voiceBtn.addEventListener('click', () => {
                    if (this.isListening) {
                        this.stopListening();
                    } else {
                        this.startListening();
                    }
                });
                
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey && e.key === 'v') {
                        e.preventDefault();
                        if (this.isListening) {
                            this.stopListening();
                        } else {
                            this.startListening();
                        }
                    }
                });
            }
            
            startListening() {
                try {
                    this.recognition.start();
                } catch (error) {
                    console.error('Error starting speech recognition:', error);
                    this.updateStatus('Error starting voice control', false);
                }
            }
            
            stopListening() {
                this.isListening = false;
                this.voiceBtn.classList.remove('listening');
                this.voiceBtn.innerHTML = '<i class="bi-mic"></i>';
                this.updateStatus('Click to start voice control');
                
                try {
                    this.recognition.stop();
                } catch (error) {
                    console.error('Error stopping speech recognition:', error);
                }
            }
            
            updateStatus(message, isListening = false) {
                this.voiceStatus.textContent = message;
                this.voiceStatus.classList.toggle('show', true);
                this.voiceStatus.classList.toggle('listening', isListening);
                
                setTimeout(() => {
                    this.voiceStatus.classList.remove('show');
                }, 3000);
            }
            
            processCommand(command) {
                console.log('Voice command received:', command);
                
                if (command.includes('analyze') || command.includes('process')) {
                    this.speak('Analyzing JSON data');
                    analyzeJSON();
                    return;
                }
                
                if (command.includes('copy') || command.includes('copy result')) {
                    this.speak('Copying results to clipboard');
                    copyToClipboard();
                    return;
                }
                
                if (command.includes('clear') || command.includes('reset')) {
                    this.speak('Clearing form');
                    document.getElementById('jsonInput').value = '';
                    document.getElementById('singleLabelOnly').checked = false;
                    document.getElementById('multipleLabelsOnly').checked = false;
                    document.getElementById('result').innerHTML = '';
                    document.getElementById('result').classList.remove('visible');
                    return;
                }
                
                if (command.includes('go home') || command.includes('back to menu')) {
                    this.speak('Navigating to home page');
                    window.location.href = '../../index.html';
                    return;
                }
                
                this.speak('Command not recognized. Try saying "analyze" or "copy result"');
                this.updateStatus('Command not recognized');
            }
            
            speak(text) {
                if (typeof window.speakWithGoogle === 'function') {
                    window.speakWithGoogle(text, 'en-US-Standard-D', { speakingRate: 0.9 })
                        .then((success) => {
                            if (!success) {
                                this.speakWithBrowser(text);
                            }
                        })
                        .catch(() => this.speakWithBrowser(text));
                    return;
                }

                this.speakWithBrowser(text);
            }

            speakWithBrowser(text) {
                if (this.synthesis) {
                    const utterance = new SpeechSynthesisUtterance(text);
                    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || ('ontouchstart' in window && window.innerWidth < 768);
                    utterance.rate = isMobile ? 1.0 : 0.9;
                    utterance.pitch = 1;
                    this.synthesis.cancel();
                    this.synthesis.speak(utterance);
                }
            }
        }

        // Set today's date in the footer
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString();

        // Initialize voice controller
        const voiceController = new VoiceController();

        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 15;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particle.style.opacity = Math.random() * 0.5 + 0.1;
                particle.style.width = particle.style.height = (Math.random() * 6 + 2) + 'px';
                
                particlesContainer.appendChild(particle);
            }
        }

        // Initialize particles on page load
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            setActiveToolPill();
        });

        // Highlight the current tool in the pill bar
        function setActiveToolPill() {
            const current = window.location.pathname.split('/').pop();
            const links = document.querySelectorAll('#toolPillNav .nav-link');
            links.forEach(link => {
                const target = (link.getAttribute('href') || '').split('/').pop();
                if (target === current) {
                    link.classList.add('active');
                    link.setAttribute('aria-current', 'page');
                }
            });
        }

        // Analysis Functions
        function analyzeJSON() {
            const analyzeBtn = document.querySelector('button[onclick="analyzeJSON()"]');
            const resultDiv = document.getElementById('result');
            
            try {
                // Add loading state
                analyzeBtn.classList.add('loading');
                analyzeBtn.innerHTML = '<i class="bi-hourglass-split me-2"></i>Analyzing...';
                
                let input = document.getElementById('jsonInput').value;
                
                // Replace Excel smart quotes with regular quotes
                input = input.replace(/[""]/g, '"');
                
                // Extract valid JSON objects using regex
                const jsonRegex = /\{[\s\S]*?\}/g;
                const matches = input.match(jsonRegex);
                
                if (!matches) {
                    throw new Error('No valid JSON objects found in input');
                }

                // Parse each JSON object
                const jsonData = matches.map(match => {
                    try {
                        return JSON.parse(match);
                    } catch (e) {
                        console.error('Error parsing JSON object:', e);
                        return null;
                    }
                }).filter(obj => obj !== null);

                const singleLabelOnly = document.getElementById('singleLabelOnly').checked;
                const multipleLabelsOnly = document.getElementById('multipleLabelsOnly').checked;
                
                // Create a new array to store transformed data
                const transformedData = [];
                
                // First, find all unique FieldIDs and their labels
                const fieldIdMap = {};
                
                // Process each item in sequence
                for (let i = 0; i < jsonData.length; i++) {
                    const item = jsonData[i];
                    if (item.CType === 'Label') {
                        // Look ahead for the next control
                        for (let j = i + 1; j < jsonData.length; j++) {
                            const nextItem = jsonData[j];
                            if ((nextItem.CType === 'TextBox' || nextItem.CType === 'DropdownBox') && nextItem.FieldID) {
                                // Found the matching control
                                if (!fieldIdMap[nextItem.FieldID]) {
                                    fieldIdMap[nextItem.FieldID] = {
                                        labels: new Set(),
                                        controlType: nextItem.CType
                                    };
                                }
                                // Add the label to the Set
                                fieldIdMap[nextItem.FieldID].labels.add(item.Text);
                                break;
                            }
                        }
                    } else if ((item.CType === 'TextBox' || item.CType === 'DropdownBox') && item.FieldID) {
                        // If we find a control without a preceding label, add it to the map
                        if (!fieldIdMap[item.FieldID]) {
                            fieldIdMap[item.FieldID] = {
                                labels: new Set(),
                                controlType: item.CType
                            };
                        }
                    }
                }
                
                // Convert the map to our desired output format
                Object.keys(fieldIdMap).sort().forEach(fieldId => {
                    // Convert Set to Array for output
                    const labels = Array.from(fieldIdMap[fieldId].labels);
                    
                    // Apply filters based on checkbox states
                    let shouldInclude = true;
                    if (singleLabelOnly && labels.length !== 1) {
                        shouldInclude = false;
                    }
                    if (multipleLabelsOnly && labels.length <= 1) {
                        shouldInclude = false;
                    }
                    
                    if (shouldInclude) {
                        transformedData.push({
                            FieldID: fieldId,
                            ControlType: fieldIdMap[fieldId].controlType,
                            Labels: labels
                        });
                    }
                });
                
                // Display the results with animation
                resultDiv.innerHTML = `<pre>${JSON.stringify(transformedData, null, 2)}</pre>`;
                resultDiv.classList.add('visible');
                
                // Scroll to result
                resultDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
                
                voiceController.speak('Analysis completed');
                
            } catch (error) {
                resultDiv.innerHTML = `<pre>Error: ${error.message}</pre>`;
                resultDiv.classList.add('visible');
                voiceController.speak('Error during analysis');
            } finally {
                // Remove loading state
                analyzeBtn.classList.remove('loading');
                analyzeBtn.innerHTML = '<i class="bi-search me-2"></i>Analyze';
            }
        }

        function copyToClipboard() {
            const copyBtn = document.querySelector('button[onclick="copyToClipboard()"]');
            const resultText = document.getElementById('result').textContent;
            
            // Add loading state
            copyBtn.classList.add('loading');
            
            navigator.clipboard.writeText(resultText).then(() => {
                // Show success feedback
                copyBtn.innerHTML = '<i class="bi-check me-2"></i>Copied!';
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="bi-clipboard me-2"></i>Copy Result';
                }, 2000);
                voiceController.speak('Results copied to clipboard');
            }).catch(err => {
                console.error('Failed to copy text: ', err);
                copyBtn.innerHTML = '<i class="bi-x me-2"></i>Failed';
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="bi-clipboard me-2"></i>Copy Result';
                }, 2000);
                voiceController.speak('Failed to copy results');
            }).finally(() => {
                copyBtn.classList.remove('loading');
            });
        }

        // Make voice controller globally accessible for debugging
        window.voiceController = voiceController;
    </script>
  <script src="/shared/tts.js"></script>
