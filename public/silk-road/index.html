<!DOCTYPE html>
<!-- Development work by David Lane -->
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>The Silk Road — A caravan through eight atlases</title>
  <meta name="description" content="A bilingual Silk Road journey from Alexandria to Oman: silk, incense, purple dye and paper, handed from guide to guide across eight Middle East atlases."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="/shared/styles.css"/>
  <link rel="stylesheet" href="/shared/css/levant-atlas-nav.css"/>
  <link rel="stylesheet" href="/silk-road/css/silk-road.css?v=3"/>
  <script src="/shared/menu-config.js"></script>
  <script src="/shared/modern-navbar.js"></script>
  <script src="/shared/js/levant-atlas-nav.js" defer></script>
  <script src="/shared/dark-mode.js" defer></script>
</head>
<body class="sr-page">
  <modern-navbar></modern-navbar>

  <main class="container-xl sr-main" id="srMain">
    <header class="sr-hero">
      <div>
        <p class="sr-kicker" data-sr-i18n="kicker">A caravan through eight atlases</p>
        <h1 class="sr-title" data-sr-i18n="title">The Silk Road</h1>
        <p class="sr-lead" data-sr-i18n="lead">Follow silk, incense, purple dye and paper from Alexandria to the monsoon ports of Oman.</p>
      </div>
      <div class="sr-hero__actions">
        <button type="button" class="btn sr-btn sr-btn--gold" id="srPlay" aria-pressed="false">
          <i class="bi bi-play-fill" aria-hidden="true"></i>
          <span data-sr-i18n="play">Play journey</span>
        </button>
        <button type="button" class="btn sr-btn" id="srListen" aria-pressed="false">
          <i class="bi bi-volume-up-fill" aria-hidden="true"></i>
          <span data-sr-i18n="listen">Listen</span>
        </button>
        <button type="button" class="btn sr-btn" id="srLangToggle" lang="ar">العربية</button>
      </div>
    </header>

    <div class="row g-4">
      <div class="col-lg-7">
        <section class="sr-card sr-map-card" aria-label="Silk Road map">
          <svg class="sr-map" id="srMap" viewBox="0 0 800 700" role="img" aria-labelledby="srMapTitle">
            <title id="srMapTitle">Sketch map of the Silk Road from Alexandria to Sohar</title>
            <defs>
              <radialGradient id="srLand" cx="45%" cy="40%" r="75%">
                <stop offset="0%" stop-color="#3a2d1d"/>
                <stop offset="100%" stop-color="#1d160e"/>
              </radialGradient>
              <filter id="srGlow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="4" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <rect width="800" height="700" fill="url(#srLand)"/>
            <g class="sr-sea" aria-hidden="true">
              <path d="M0,95 L120,88 L205,85 L215,95 L200,130 L190,150 L178,175 L165,205 L150,215 L100,225 L50,220 L0,226 Z"/>
              <path d="M112,250 L130,292 L172,262 L162,322 L232,452 L302,562 L392,690 L400,700 L362,700 L282,602 L200,482 L140,362 L108,282 Z"/>
              <path d="M512,250 L500,272 L545,330 L575,375 L598,352 L650,388 L690,382 L708,345 L722,372 L735,395 L760,410 L795,437 L740,500 L700,545 L652,574 L560,625 L470,660 L410,700 L800,700 L800,365 L760,362 L720,330 L690,318 L650,322 L600,300 L560,285 L530,262 Z"/>
              <path d="M470,0 L475,40 L500,70 L540,80 L590,78 L610,50 L605,0 Z"/>
            </g>
            <g class="sr-rivers" aria-hidden="true">
              <path d="M81,249 Q92,330 108,420 T130,560"/>
              <path d="M262,80 Q300,110 325,137 T407,200 T512,250"/>
              <path d="M362,70 Q372,82 378,92 T409,167 T512,250"/>
            </g>
            <g class="sr-sea-labels" aria-hidden="true">
              <text x="70" y="170" data-sr-i18n="seaMed">Mediterranean</text>
              <text x="250" y="520" transform="rotate(52 250 520)" data-sr-i18n="seaRed">Red Sea</text>
              <text x="600" y="640" data-sr-i18n="seaArabian">Arabian Sea</text>
              <text x="500" y="35" data-sr-i18n="seaCaspian">Caspian</text>
            </g>
            <g id="srRouteBase" class="sr-route-base"></g>
            <g id="srRouteDone" class="sr-route-done"></g>
            <g id="srStops"></g>
            <g id="srCaravan" class="sr-caravan" filter="url(#srGlow)">
              <circle r="9"/>
              <text y="4" text-anchor="middle" aria-hidden="true">🐪</text>
            </g>
          </svg>
          <div class="sr-legend">
            <span><i class="sr-legend__land" aria-hidden="true"></i><span data-sr-i18n="legLand">Caravan road</span></span>
            <span><i class="sr-legend__sea" aria-hidden="true"></i><span data-sr-i18n="legSea">Sea lane</span></span>
          </div>
        </section>
        <ol class="sr-steps" id="srSteps" aria-label="Journey stops"></ol>
      </div>

      <div class="col-lg-5">
        <section class="sr-card sr-stop" id="srStop" aria-live="polite">
          <p class="sr-stop__count" id="srStopCount"></p>
          <h2 class="sr-stop__city" id="srStopCity"></h2>
          <p class="sr-stop__country" id="srStopCountry"></p>
          <p class="sr-stop__era" id="srStopEra"></p>
          <p class="sr-stop__story" id="srStopStory"></p>
          <h3 class="sr-stop__label" data-sr-i18n="goods">Goods traded here</h3>
          <ul class="sr-goods" id="srStopGoods"></ul>
          <figure class="sr-handoff">
            <figcaption><span data-sr-i18n="handoff">Handoff</span> · <strong id="srStopGuide"></strong></figcaption>
            <blockquote id="srStopHandoff"></blockquote>
          </figure>
          <div class="sr-stop__nav">
            <button type="button" class="btn sr-btn" id="srPrev">
              <i class="bi bi-arrow-left" aria-hidden="true"></i>
              <span data-sr-i18n="prev">Previous stop</span>
            </button>
            <button type="button" class="btn sr-btn sr-btn--gold" id="srNext">
              <span data-sr-i18n="next">Next stop</span>
              <i class="bi bi-arrow-right" aria-hidden="true"></i>
            </button>
          </div>
          <a class="sr-atlas-link" id="srAtlasLink" href="/egypt/">
            <i class="bi bi-globe-central-south-asia" aria-hidden="true"></i>
            <span id="srAtlasLabel"></span>
          </a>
        </section>

        <section class="sr-card sr-cargo" aria-labelledby="srCargoTitle">
          <h2 class="sr-stop__label" id="srCargoTitle" data-sr-i18n="cargo">Cargo manifest</h2>
          <ul class="sr-goods sr-goods--cargo" id="srCargo"></ul>
          <p class="sr-cargo__done" id="srCargoDone" hidden></p>
        </section>
      </div>
    </div>

    <p class="sr-note" data-sr-i18n="note">Sketch map, not to scale.</p>
  </main>

  <script src="/shared/tts.js"></script>
  <script src="/silk-road/js/silk-road.js?v=3"></script>
</body>
</html>
