<!DOCTYPE html>
<!-- Development work by David Lane -->
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Coffee Dreams</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="/shared/design-tokens.css"/>
  <script src="/shared/modern-navbar.js"></script>
  <script src="/shared/coffee-dreams-guard.js"></script>
  <style>
    :root {
      --cd-espresso: #2a1810;
      --cd-cream: #f5e6d3;
      --cd-caramel: #c87941;
      --cd-neon-pink: #ff6b9d;
      --cd-neon-teal: #4ecdc4;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(200, 121, 65, 0.25), transparent),
        linear-gradient(180deg, #1a0f0a 0%, var(--cd-espresso) 45%, #120a08 100%);
      color: var(--cd-cream);
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    .cd-hero {
      text-align: center;
      padding: 3rem 1rem 2rem;
    }

    .cd-hero h1 {
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--cd-cream), var(--cd-caramel));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .cd-hero p {
      color: #c9b8a8;
      letter-spacing: 0.06em;
      margin: 0;
    }

    .cd-card {
      position: relative;
      border-radius: 1rem;
      overflow: hidden;
      border: 1px solid rgba(255, 200, 150, 0.12);
      background: rgba(0, 0, 0, 0.35);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
      cursor: pointer;
      height: 100%;
    }

    .cd-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45);
    }

    .cd-card-img-wrap {
      position: relative;
      aspect-ratio: 4 / 5;
      overflow: hidden;
    }

    .cd-card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .cd-card:hover .cd-card-img-wrap img {
      transform: scale(1.05);
    }

    .cd-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(18, 10, 8, 0.92) 0%, rgba(18, 10, 8, 0.15) 55%, transparent 100%);
      pointer-events: none;
    }

    .cd-card-body {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 1.25rem;
      z-index: 1;
    }

    .cd-card-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 0 0 0.35rem;
      letter-spacing: 0.03em;
    }

    .cd-card-caption {
      font-size: 0.85rem;
      color: #d4c4b0;
      margin: 0 0 0.5rem;
      line-height: 1.45;
    }

    .cd-card-credit {
      font-size: 0.72rem;
      color: #9a8a7a;
    }

    .cd-card-credit a {
      color: var(--cd-caramel);
      text-decoration: none;
    }

    .cd-card-credit a:hover {
      text-decoration: underline;
    }

    .mood-neon .cd-card-img-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 60px rgba(255, 107, 157, 0.2);
      pointer-events: none;
    }

    .mood-night .cd-card-img-wrap img {
      filter: saturate(1.1) contrast(1.05) brightness(0.85);
    }

    .mood-garden .cd-card-img-wrap img {
      filter: saturate(1.15) brightness(1.05);
    }

    .mood-retro .cd-card-img-wrap img {
      filter: sepia(0.45) contrast(1.05) brightness(0.95);
    }

    .mood-boba .cd-card-img-wrap img {
      filter: saturate(1.25) hue-rotate(-5deg);
    }

    .mood-street .cd-card-img-wrap img {
      filter: contrast(1.08) saturate(0.95);
    }

    .mood-rain .cd-card-img-wrap img {
      filter: saturate(0.75) contrast(1.1) brightness(0.9);
    }

    .mood-rain .cd-card-img-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(120, 160, 200, 0.15), transparent 60%);
      pointer-events: none;
    }

    .cd-footer {
      text-align: center;
      padding: 2rem 1rem 3rem;
      color: #8a7a6a;
      font-size: 0.8rem;
    }

    .cd-footer a {
      color: var(--cd-caramel);
    }

    #coffeeDreamsGrid .col {
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <modern-navbar></modern-navbar>

  <main id="coffeeDreamsContent" hidden aria-hidden="true">
    <header class="cd-hero">
      <p class="small text-uppercase mb-2" style="color: var(--cd-caramel); letter-spacing: 0.2em;">Private gallery</p>
      <h1>Coffee Dreams</h1>
      <p id="cdSubtitle">Seven café moods — Saigon to rainy window</p>
    </header>

    <div class="container-xl pb-2">
      <div class="row" id="coffeeDreamsGrid"></div>
    </div>

    <footer class="cd-footer">
      <p class="mb-1">Photos via <a href="https://unsplash.com" target="_blank" rel="noopener noreferrer">Unsplash</a> — free to use with attribution.</p>
      <p class="mb-0">Developed by David E Lane</p>
    </footer>
  </main>

  <script>
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function buildCardHtml(card, index) {
      const moodClass = escapeHtml(card.moodClass || '');
      const title = escapeHtml(card.title);
      const caption = escapeHtml(card.caption);
      const img = escapeHtml(card.imageUrl);
      const alt = escapeHtml(card.title);
      const photographer = escapeHtml(card.photographer);
      const photographerUrl = escapeHtml(card.photographerUrl);
      const photoUrl = escapeHtml(card.unsplashPhotoUrl);

      return `
        <div class="col-12 col-md-6 col-lg-4">
          <article class="cd-card ${moodClass}" tabindex="0" role="button" aria-label="${title}"
            data-card-index="${index}">
            <div class="cd-card-img-wrap">
              <img src="${img}" alt="${alt}" loading="lazy" decoding="async"/>
              <div class="cd-card-overlay"></div>
              <div class="cd-card-body">
                <h2 class="cd-card-title">${title}</h2>
                <p class="cd-card-caption">${caption}</p>
                <p class="cd-card-credit mb-0">
                  Photo by <a href="${photographerUrl}" target="_blank" rel="noopener noreferrer">${photographer}</a>
                  · <a href="${photoUrl}" target="_blank" rel="noopener noreferrer">Unsplash</a>
                </p>
              </div>
            </div>
          </article>
        </div>`;
    }

    async function loadGallery() {
      const grid = document.getElementById('coffeeDreamsGrid');
      if (!grid) return;

      try {
        const res = await fetch('/data/coffee-dreams-cards.json');
        const data = await res.json();
        if (data.subtitle) {
          const sub = document.getElementById('cdSubtitle');
          if (sub) sub.textContent = data.subtitle;
        }
        const cards = Array.isArray(data.cards) ? data.cards : [];
        grid.innerHTML = cards.map((card, index) => buildCardHtml(card, index)).join('');
      } catch (err) {
        grid.innerHTML = '<div class="col-12"><p class="text-warning">Could not load gallery cards.</p></div>';
        console.error(err);
      }
    }

    window.addEventListener('coffee-dreams-unlocked', loadGallery);

    if (window.CoffeeDreamsGuard?.readUnlock?.()) {
      loadGallery();
    }
  </script>
</body>
</html>
