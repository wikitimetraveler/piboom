<!DOCTYPE html>
<!-- Development work by David Lane -->
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Coffee Dreams</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="/shared/design-tokens.css"/>
  <script src="/shared/modern-navbar.js"></script>
  <script src="/shared/coffee-dreams-guard.js"></script>
  <style>
    :root {
      --cd-espresso: #1c110c;
      --cd-roast: #2e1a12;
      --cd-cream: #f3e6d4;
      --cd-foam: #fff6ea;
      --cd-caramel: #c4844a;
      --cd-caramel-deep: #9a5c2e;
      --cd-steam: rgba(243, 230, 212, 0.07);
      --cd-ink-muted: #b9a693;
      --cd-font-display: "Fraunces", "Palatino Linotype", Palatino, serif;
      --cd-font-body: "Sora", "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      color: var(--cd-cream);
      font-family: var(--cd-font-body);
      font-weight: 300;
      background-color: var(--cd-espresso);
      background-image:
        radial-gradient(ellipse 90% 55% at 12% -8%, rgba(196, 132, 74, 0.28), transparent 55%),
        radial-gradient(ellipse 70% 45% at 92% 8%, rgba(90, 52, 32, 0.55), transparent 50%),
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(60, 32, 18, 0.55), transparent 55%),
        linear-gradient(168deg, #140c09 0%, var(--cd-roast) 42%, #100905 100%);
      background-attachment: fixed;
    }

    /* Soft steam / grain atmosphere */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.55;
      background:
        radial-gradient(ellipse 28% 18% at 22% 18%, var(--cd-steam), transparent 70%),
        radial-gradient(ellipse 22% 14% at 78% 22%, rgba(255, 246, 234, 0.05), transparent 70%),
        radial-gradient(ellipse 35% 20% at 48% 8%, rgba(196, 132, 74, 0.08), transparent 65%);
      animation: cd-steam-drift 18s ease-in-out infinite alternate;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px 180px;
    }

    @keyframes cd-steam-drift {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(1.5%, -2%, 0) scale(1.04); }
    }

    @keyframes cd-hero-rise {
      from {
        opacity: 0;
        transform: translateY(1.1rem);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes cd-print-in {
      from {
        opacity: 0;
        transform: translateY(1.25rem);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    modern-navbar,
    main,
    #coffeeDreamsAuthOverlay {
      position: relative;
      z-index: 1;
    }

    .cd-hero {
      position: relative;
      text-align: center;
      padding: clamp(2.5rem, 8vh, 4.5rem) 1.25rem 2.25rem;
      max-width: 42rem;
      margin: 0 auto;
      animation: cd-hero-rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .cd-hero::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 12%;
      width: min(28rem, 88vw);
      height: min(18rem, 42vw);
      transform: translateX(-50%);
      background:
        radial-gradient(ellipse at center, rgba(196, 132, 74, 0.22) 0%, transparent 68%);
      pointer-events: none;
      z-index: -1;
      filter: blur(2px);
    }

    .cd-hero-brand {
      margin: 0 0 0.85rem;
      font-family: var(--cd-font-display);
      font-optical-sizing: auto;
      font-weight: 300;
      font-size: clamp(3rem, 11vw, 5.25rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--cd-foam);
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.35);
    }

    .cd-hero-brand em {
      font-style: italic;
      font-weight: 500;
      color: var(--cd-caramel);
    }

    .cd-hero-lead {
      margin: 0 auto 1.5rem;
      max-width: 26rem;
      font-size: clamp(0.95rem, 2.4vw, 1.05rem);
      line-height: 1.55;
      font-weight: 300;
      color: var(--cd-ink-muted);
      letter-spacing: 0.01em;
    }

    .cd-venue-switcher {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0;
      margin: 0 auto;
      padding: 0.28rem;
      border: 1px solid rgba(243, 230, 212, 0.14);
      background: rgba(12, 7, 5, 0.45);
      border-radius: 0.35rem;
    }

    .cd-venue-toggle {
      border: 0;
      background: transparent;
      color: var(--cd-ink-muted);
      border-radius: 0.22rem;
      padding: 0.55rem 1.15rem;
      font-family: var(--cd-font-body);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.25s ease, background 0.25s ease;
    }

    .cd-venue-toggle:hover {
      color: var(--cd-cream);
      background: rgba(243, 230, 212, 0.06);
    }

    .cd-venue-toggle.is-active {
      background: var(--cd-caramel);
      color: #1a100b;
    }

    .cd-venue-toggle:focus-visible {
      outline: 2px solid var(--cd-caramel);
      outline-offset: 2px;
    }

    .cd-venue-note {
      margin: 0.9rem auto 0;
      max-width: 28rem;
      font-size: 0.78rem;
      line-height: 1.5;
      color: #8f7d6c;
      letter-spacing: 0.02em;
    }

    .cd-venue-qr {
      margin: 1.15rem auto 0;
      max-width: 18rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
      text-align: center;
    }

    .cd-venue-qr[hidden] {
      display: none !important;
    }

    .cd-venue-qr-name {
      margin: 0;
      font-family: var(--cd-font-display);
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--cd-foam);
      letter-spacing: -0.01em;
    }

    .cd-venue-qr-address {
      margin: 0;
      font-size: 0.78rem;
      line-height: 1.45;
      color: var(--cd-ink-muted);
      font-weight: 300;
    }

    .cd-venue-qr .cd-card-qr-shell {
      margin-top: 0.2rem;
      width: 140px;
      height: 140px;
      padding: 0.4rem;
    }

    .cd-venue-qr .cd-card-qr-shell img,
    .cd-venue-qr .cd-card-qr-shell canvas {
      width: 124px;
      height: 124px;
    }

    .cd-venue-qr .cd-card-map-link {
      font-size: 0.8rem;
    }

    .cd-gallery {
      padding-bottom: 0.5rem;
    }

    .cd-card {
      position: relative;
      background: transparent;
      border: 0;
      cursor: pointer;
      height: 100%;
      min-height: 28rem;
      perspective: 1200px;
      animation: cd-print-in 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #coffeeDreamsGrid .col:nth-child(1) .cd-card { animation-delay: 0.05s; }
    #coffeeDreamsGrid .col:nth-child(2) .cd-card { animation-delay: 0.12s; }
    #coffeeDreamsGrid .col:nth-child(3) .cd-card { animation-delay: 0.19s; }
    #coffeeDreamsGrid .col:nth-child(4) .cd-card { animation-delay: 0.26s; }
    #coffeeDreamsGrid .col:nth-child(5) .cd-card { animation-delay: 0.33s; }
    #coffeeDreamsGrid .col:nth-child(6) .cd-card { animation-delay: 0.4s; }
    #coffeeDreamsGrid .col:nth-child(7) .cd-card { animation-delay: 0.47s; }
    #coffeeDreamsGrid .col:nth-child(8) .cd-card { animation-delay: 0.54s; }
    #coffeeDreamsGrid .col:nth-child(9) .cd-card { animation-delay: 0.61s; }

    .cd-card:hover {
      transform: translateY(-5px);
    }

    .cd-card:focus-visible {
      outline: none;
    }

    .cd-card:focus-visible .cd-card-face {
      box-shadow:
        0 0 0 2px rgba(196, 132, 74, 0.65),
        0 18px 36px rgba(0, 0, 0, 0.4);
    }

    .cd-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 28rem;
      transform-style: preserve-3d;
      transition: transform 0.75s cubic-bezier(0.4, 0.05, 0.2, 1);
    }

    .cd-card.flipped .cd-card-inner {
      transform: rotateY(180deg);
    }

    /* Print / photo-object faces */
    .cd-card-face {
      position: absolute;
      inset: 0;
      border-radius: 0.2rem;
      overflow: hidden;
      border: 1px solid rgba(243, 230, 212, 0.1);
      background: #120b08;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.38);
      backface-visibility: hidden;
      transition: box-shadow 0.4s ease;
    }

    .cd-card:hover .cd-card-face {
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.48);
    }

    .cd-card-front {
      transform: rotateY(0deg);
      padding: 0.55rem 0.55rem 0.7rem;
      background:
        linear-gradient(180deg, #3a281c 0%, #241610 100%);
    }

    .cd-card-back {
      transform: rotateY(180deg);
      padding: 0.55rem 0.55rem 0.7rem;
      display: flex;
      align-items: stretch;
      justify-content: center;
      background:
        linear-gradient(180deg, #3a281c 0%, #241610 100%);
    }

    .cd-card-back .cd-card-img-wrap {
      display: block;
    }

    .cd-card-back-caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
      padding: 1.05rem;
      pointer-events: none;
    }

    .cd-card-img-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 0.08rem;
      background: #0a0604;
    }

    .cd-card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .cd-card:hover .cd-card-img-wrap img {
      transform: scale(1.04);
    }

    .cd-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(12, 7, 5, 0.94) 0%,
        rgba(12, 7, 5, 0.35) 42%,
        rgba(12, 7, 5, 0.05) 70%,
        transparent 100%
      );
      pointer-events: none;
    }

    .cd-card-body {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 1.15rem 1.05rem 1.05rem;
      z-index: 1;
    }

    .cd-card-title {
      font-family: var(--cd-font-display);
      font-size: 1.28rem;
      font-weight: 500;
      margin: 0 0 0.35rem;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--cd-foam);
    }

    .cd-card-caption {
      font-size: 0.82rem;
      color: var(--cd-ink-muted);
      margin: 0 0 0.55rem;
      line-height: 1.5;
      font-weight: 300;
    }

    .cd-card-credit {
      font-size: 0.7rem;
      color: #8a7868;
    }

    .cd-card-credit a {
      color: var(--cd-caramel);
      text-decoration: none;
    }

    .cd-card-credit a:hover {
      text-decoration: underline;
    }

    .cd-card-hint {
      margin-top: 0.55rem;
      font-size: 0.68rem;
      color: #9a8774;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .cd-card-hint i {
      margin-right: 0.2rem;
      opacity: 0.85;
    }

    .cd-card-qr-shell {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 156px;
      height: 156px;
      padding: 0.45rem;
      border-radius: 0.15rem;
      background: var(--cd-foam);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3);
    }

    .cd-card-qr-shell img,
    .cd-card-qr-shell canvas {
      width: 140px;
      height: 140px;
      display: block;
    }

    .cd-card-map-link {
      color: var(--cd-cream);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.88rem;
      letter-spacing: 0.02em;
      border-bottom: 1px solid rgba(196, 132, 74, 0.55);
      padding-bottom: 0.1rem;
    }

    .cd-card-map-link:hover {
      color: var(--cd-foam);
      border-bottom-color: var(--cd-caramel);
    }

    /* Café mood filters — warm, no neon pink */
    .mood-neon .cd-card-img-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 50px rgba(196, 132, 74, 0.18);
      pointer-events: none;
    }

    .mood-night .cd-card-img-wrap img {
      filter: saturate(1.08) contrast(1.06) brightness(0.86);
    }

    .mood-garden .cd-card-img-wrap img {
      filter: saturate(1.12) brightness(1.04);
    }

    .mood-retro .cd-card-img-wrap img {
      filter: sepia(0.4) contrast(1.05) brightness(0.95);
    }

    .mood-boba .cd-card-img-wrap img {
      filter: saturate(1.18) hue-rotate(-4deg);
    }

    .mood-street .cd-card-img-wrap img {
      filter: contrast(1.08) saturate(0.95);
    }

    .mood-rain .cd-card-img-wrap img {
      filter: saturate(0.78) contrast(1.08) brightness(0.9);
    }

    .mood-rain .cd-card-img-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(140, 160, 175, 0.12), transparent 60%);
      pointer-events: none;
    }

    .cd-footer {
      text-align: center;
      padding: 2.5rem 1rem 3.25rem;
      color: #6f5f52;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
    }

    .cd-footer a {
      color: var(--cd-caramel);
    }

    #coffeeDreamsGrid .col {
      margin-bottom: 1.65rem;
    }

    @media (max-width: 575.98px) {
      .cd-hero {
        padding-top: 2rem;
        padding-bottom: 1.75rem;
      }

      .cd-venue-switcher {
        width: 100%;
        display: flex;
      }

      .cd-venue-toggle {
        flex: 1 1 auto;
        padding-left: 0.65rem;
        padding-right: 0.65rem;
      }

      .cd-card,
      .cd-card-inner {
        min-height: 24rem;
      }

      .cd-card-front {
        padding: 0.45rem 0.45rem 0.55rem;
      }

      .cd-card-title {
        font-size: 1.15rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before,
      .cd-hero,
      .cd-card,
      .cd-card-inner,
      .cd-card-img-wrap img {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <modern-navbar></modern-navbar>

  <main id="coffeeDreamsContent" hidden aria-hidden="true">
    <header class="cd-hero">
      <h1 class="cd-hero-brand">Coffee <em>Dreams</em></h1>
      <p id="cdSubtitle" class="cd-hero-lead">Eight café moods — Saigon to rainy window</p>
      <div id="cdVenueSwitcher" class="cd-venue-switcher" role="group" aria-label="Venue switcher"></div>
      <div id="cdVenueQr" class="cd-venue-qr" hidden></div>
      <p id="cdVenueNote" class="cd-venue-note">Tap a print to flip poses. Double-tap to enlarge the photo.</p>
    </header>

    <div class="container-xl cd-gallery">
      <div class="row" id="coffeeDreamsGrid"></div>
    </div>

    <footer class="cd-footer">
      <p class="mb-0">Developed by David E Lane</p>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@gh-pages/qrcode.min.js"></script>
  <script>
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    const coffeeQrCache = new Map();
    let coffeeGalleryData = null;
    let coffeeActiveVenueId = '';

    function buildMapSearchUrl(name, address, explicitUrl) {
      const rawUrl = String(explicitUrl || '').trim();
      if (rawUrl) return rawUrl;

      const query = [name, address].filter(Boolean).join(', ');
      if (!query) return '';
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
    }

    function generateQrDataUrl(url, size = 144) {
      if (!window.QRCode || !url) return '';

      const cacheKey = `${size}:${url}`;
      if (coffeeQrCache.has(cacheKey)) {
        return coffeeQrCache.get(cacheKey);
      }

      const mount = document.createElement('div');
      mount.style.cssText = `position:absolute;left:-9999px;top:-9999px;width:${size}px;height:${size}px;`;
      document.body.appendChild(mount);

      try {
        new window.QRCode(mount, { text: url, width: size, height: size });
        const canvas = mount.querySelector('canvas');
        const img = mount.querySelector('img');
        const dataUrl = canvas ? canvas.toDataURL('image/png') : (img ? img.src : '');
        coffeeQrCache.set(cacheKey, dataUrl || '');
        return dataUrl || '';
      } catch (err) {
        return '';
      } finally {
        if (mount.parentNode) {
          mount.parentNode.removeChild(mount);
        }
      }
    }

    function getVenueEntries(data) {
      return Object.entries(data && typeof data.venues === 'object' ? data.venues : {});
    }

    function getDefaultVenueConfig(data, activeVenueIdOverride) {
      const venues = data && typeof data.venues === 'object' ? data.venues : {};
      const activeVenueId = String(activeVenueIdOverride || data?.activeVenueId || '').trim();
      const activeVenue = activeVenueId && venues[activeVenueId] ? venues[activeVenueId] : null;
      const firstVenueKey = Object.keys(venues)[0] || '';
      const firstVenue = firstVenueKey ? venues[firstVenueKey] : null;
      const fallbackName = String(data?.defaultLocationName || 'Coffee Dreams Location').trim();
      const fallbackAddress = String(data?.defaultLocationAddress || '').trim();
      const selectedVenue = activeVenue || firstVenue || {};

      return {
        id: activeVenue ? activeVenueId : (firstVenueKey || 'default'),
        name: String(selectedVenue.name || fallbackName).trim(),
        address: String(selectedVenue.address || fallbackAddress).trim()
      };
    }

    function renderVenueSwitcher(data, activeVenueIdOverride) {
      const switcher = document.getElementById('cdVenueSwitcher');
      if (!switcher) return;

      const venues = getVenueEntries(data);
      if (venues.length < 2) {
        switcher.innerHTML = '';
        switcher.hidden = true;
        return;
      }

      switcher.hidden = false;
      const activeVenue = getDefaultVenueConfig(data, activeVenueIdOverride);
      switcher.innerHTML = venues.map(([venueId, venue]) => {
        const name = escapeHtml(venue?.name || venueId);
        const activeClass = venueId === activeVenue.id ? ' is-active' : '';
        return `<button type="button" class="cd-venue-toggle${activeClass}" data-venue-id="${escapeHtml(venueId)}" aria-pressed="${venueId === activeVenue.id ? 'true' : 'false'}">${name}</button>`;
      }).join('');

      switcher.querySelectorAll('[data-venue-id]').forEach((button) => {
        button.addEventListener('click', () => {
          const nextVenueId = String(button.getAttribute('data-venue-id') || '').trim();
          if (!nextVenueId || nextVenueId === coffeeActiveVenueId) return;
          setCoffeeVenue(nextVenueId);
        });
      });
    }

    function renderVenueQr(data, activeVenueIdOverride) {
      const mount = document.getElementById('cdVenueQr');
      if (!mount) return;

      const venue = getDefaultVenueConfig(data, activeVenueIdOverride);
      const mapUrl = buildMapSearchUrl(venue.name, venue.address);
      const qrDataUrl = generateQrDataUrl(mapUrl, 124);

      if (!venue.name && !venue.address && !qrDataUrl) {
        mount.hidden = true;
        mount.innerHTML = '';
        return;
      }

      const name = escapeHtml(venue.name || 'Coffee Dreams Location');
      const address = escapeHtml(venue.address || '');
      const safeUrl = escapeHtml(mapUrl);
      const safeQr = escapeHtml(qrDataUrl);
      const mapLinkHtml = mapUrl
        ? `<a class="cd-card-map-link" href="${safeUrl}" target="_blank" rel="noopener noreferrer">Open in Google Maps</a>`
        : '';
      const qrHtml = qrDataUrl
        ? `<div class="cd-card-qr-shell"><img src="${safeQr}" alt="QR code for ${name}" loading="lazy" decoding="async"/></div>`
        : '';

      mount.hidden = false;
      mount.innerHTML = `
        <h2 class="cd-venue-qr-name">${name}</h2>
        ${address ? `<p class="cd-venue-qr-address">${address}</p>` : ''}
        ${qrHtml}
        ${mapLinkHtml}
      `;
    }

    function buildCardHtml(card, index) {
      const moodClass = escapeHtml(card.moodClass || '');
      const title = escapeHtml(card.title);
      const caption = escapeHtml(card.caption);
      const img = escapeHtml(card.imageUrl);
      const backImg = escapeHtml(card.backImageUrl || card.imageUrl);
      const alt = escapeHtml(card.title);
      const photographer = escapeHtml(card.photographer);
      const photographerUrl = escapeHtml(card.photographerUrl);
      const photoUrl = escapeHtml(card.unsplashPhotoUrl);
      const creditText = escapeHtml(card.creditText);
      const creditUrl = escapeHtml(card.creditUrl);
      const hasPhotographerCredit = photographer && photographerUrl && photoUrl;
      const hasLinkedTextCredit = creditText && creditUrl;
      const hasPlainTextCredit = creditText && !creditUrl;
      const creditHtml = hasPhotographerCredit
        ? `<p class="cd-card-credit mb-0">
            Photo by <a href="${photographerUrl}" target="_blank" rel="noopener noreferrer">${photographer}</a>
            · <a href="${photoUrl}" target="_blank" rel="noopener noreferrer">Unsplash</a>
          </p>`
        : hasLinkedTextCredit
          ? `<p class="cd-card-credit mb-0">
              <a href="${creditUrl}" target="_blank" rel="noopener noreferrer">${creditText}</a>
            </p>`
          : hasPlainTextCredit
            ? `<p class="cd-card-credit mb-0">${creditText}</p>`
            : '';

      return `
        <div class="col-12 col-md-6 col-lg-4">
          <article class="cd-card ${moodClass}" tabindex="0" role="button"
            aria-label="${title} card. Tap to flip pose. Double-tap to enlarge photo."
            aria-pressed="false" data-card-index="${index}">
            <div class="cd-card-inner">
              <div class="cd-card-face cd-card-front">
                <div class="cd-card-img-wrap">
                  <img src="${img}" alt="${alt}" loading="lazy" decoding="async" data-lane-lightbox-ignore="1" class="lane-lightbox-ignore"/>
                  <div class="cd-card-overlay"></div>
                  <div class="cd-card-body">
                    <h2 class="cd-card-title">${title}</h2>
                    <p class="cd-card-caption">${caption}</p>
                    ${creditHtml}
                    <p class="cd-card-hint mb-0"><i class="bi bi-arrow-repeat" aria-hidden="true"></i> Tap flip · Double-tap enlarge</p>
                  </div>
                </div>
              </div>
              <div class="cd-card-face cd-card-back">
                <div class="cd-card-img-wrap">
                  <img src="${backImg}" alt="${alt} — alternate pose" loading="lazy" decoding="async" data-lane-lightbox-ignore="1" class="lane-lightbox-ignore"/>
                  <div class="cd-card-overlay"></div>
                  <div class="cd-card-back-caption">
                    <h2 class="cd-card-title">${title}</h2>
                    <p class="cd-card-hint mb-0"><i class="bi bi-arrow-repeat" aria-hidden="true"></i> Tap flip · Double-tap enlarge</p>
                  </div>
                </div>
              </div>
            </div>
          </article>
        </div>`;
    }

    const CD_DOUBLE_TAP_MS = 280;

    function setCardFlipped(cardEl, shouldFlip) {
      const isFlipped = Boolean(shouldFlip);
      cardEl.classList.toggle('flipped', isFlipped);
      cardEl.setAttribute('aria-pressed', isFlipped ? 'true' : 'false');
    }

    function toggleCard(cardEl) {
      setCardFlipped(cardEl, !cardEl.classList.contains('flipped'));
    }

    function getVisibleCardImage(cardEl) {
      const face = cardEl.classList.contains('flipped')
        ? cardEl.querySelector('.cd-card-back img')
        : cardEl.querySelector('.cd-card-front img');
      return face || cardEl.querySelector('img');
    }

    function enlargeCardPhoto(cardEl) {
      const img = getVisibleCardImage(cardEl);
      if (!img) return;
      const src = img.currentSrc || img.src;
      if (!src) return;
      const title = cardEl.querySelector('.cd-card-title')?.textContent?.trim() || '';
      const caption = title || (img.alt || '').trim();

      if (window.LaneImageLightbox?.open) {
        window.LaneImageLightbox.open({
          src,
          alt: img.alt || caption,
          caption
        });
        return;
      }

      window.open(src, '_blank', 'noopener,noreferrer');
    }

    function bindCardInteractions(grid) {
      grid.querySelectorAll('.cd-card').forEach((cardEl) => {
        let flipTimer = null;

        const clearFlipTimer = () => {
          if (!flipTimer) return;
          clearTimeout(flipTimer);
          flipTimer = null;
        };

        cardEl.addEventListener('click', (event) => {
          if (event.target.closest('a')) return;
          event.preventDefault();

          // Second click in the window → enlarge (cancel pending flip)
          if (flipTimer) {
            clearFlipTimer();
            enlargeCardPhoto(cardEl);
            return;
          }

          flipTimer = setTimeout(() => {
            flipTimer = null;
            toggleCard(cardEl);
          }, CD_DOUBLE_TAP_MS);
        });

        cardEl.addEventListener('dblclick', (event) => {
          if (event.target.closest('a')) return;
          event.preventDefault();
          clearFlipTimer();
        });

        cardEl.addEventListener('keydown', (event) => {
          if (event.target.closest('a')) return;
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            toggleCard(cardEl);
            return;
          }
          if (event.key === 'e' || event.key === 'E') {
            event.preventDefault();
            enlargeCardPhoto(cardEl);
          }
        });
      });
    }

    function renderGallery() {
      const grid = document.getElementById('coffeeDreamsGrid');
      if (!grid || !coffeeGalleryData) return;

      renderVenueSwitcher(coffeeGalleryData, coffeeActiveVenueId);
      renderVenueQr(coffeeGalleryData, coffeeActiveVenueId);
      const cards = Array.isArray(coffeeGalleryData.cards) ? coffeeGalleryData.cards : [];
      grid.innerHTML = cards
        .map((card, index) => buildCardHtml(card, index))
        .join('');
      bindCardInteractions(grid);
    }

    function setCoffeeVenue(nextVenueId) {
      coffeeActiveVenueId = String(nextVenueId || '').trim();
      renderVenueSwitcher(coffeeGalleryData, coffeeActiveVenueId);
      renderVenueQr(coffeeGalleryData, coffeeActiveVenueId);
    }

    async function loadGallery() {
      const grid = document.getElementById('coffeeDreamsGrid');
      if (!grid) return;

      try {
        const res = await fetch('/data/coffee-dreams-cards.json');
        const data = await res.json();
        coffeeGalleryData = data;
        coffeeActiveVenueId = getDefaultVenueConfig(data).id;
        if (data.subtitle) {
          const sub = document.getElementById('cdSubtitle');
          if (sub) sub.textContent = data.subtitle;
        }
        renderGallery();
      } catch (err) {
        grid.innerHTML = '<div class="col-12"><p class="text-warning">Could not load gallery cards.</p></div>';
        console.error(err);
      }
    }

    window.addEventListener('coffee-dreams-unlocked', loadGallery);

    if (window.CoffeeDreamsGuard?.readUnlock?.()) {
      loadGallery();
    }
  </script>
</body>
</html>
