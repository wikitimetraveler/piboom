<!DOCTYPE html>
<!-- Development work by David Lane -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Music Pilgrimage Atlas — Grateful Dead</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/shared/design-tokens.css">
  <script src="/shared/modern-navbar.js"></script>
  <style>
    body {
      background: linear-gradient(160deg, #0f0c29 0%, #302b63 45%, #24243e 100%);
      color: #eee;
      min-height: 100vh;
    }

    .atlas-hero {
      text-align: center;
      padding: 2.5rem 1rem 1.5rem;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.25), rgba(240, 147, 251, 0.12));
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .atlas-hero h1 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 700;
      background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.35rem;
    }

    .atlas-hero .kicker {
      color: rgba(255, 255, 255, 0.65);
      font-size: 1rem;
    }

    .stat-pill {
      display: inline-block;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(102, 126, 234, 0.35);
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      margin: 0.25rem;
      font-size: 0.85rem;
    }

    .filter-bar {
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(8px);
      border-radius: 14px;
      padding: 1rem;
      margin-bottom: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .filter-bar .form-control,
    .filter-bar .form-select {
      background: rgba(255, 255, 255, 0.92);
      border-color: rgba(102, 126, 234, 0.4);
    }

    .panel {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(102, 126, 234, 0.25);
      border-radius: 14px;
      overflow: hidden;
      height: 100%;
    }

    .panel-header {
      padding: 0.75rem 1rem;
      background: rgba(102, 126, 234, 0.15);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-weight: 600;
      color: #c4b5fd;
    }

    #atlasMap {
      width: 100%;
      height: 420px;
      background: #1a1a2e;
    }

    .timeline-scroll {
      max-height: 420px;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .stop-card {
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid #667eea;
      border-radius: 8px;
      padding: 0.75rem 0.85rem;
      margin-bottom: 0.5rem;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .stop-card:hover,
    .stop-card.active {
      background: rgba(102, 126, 234, 0.18);
      transform: translateX(4px);
    }

    .stop-card.active {
      border-left-color: #f093fb;
    }

    .stop-date {
      font-size: 0.8rem;
      color: #a5b4fc;
      font-weight: 600;
    }

    .stop-venue {
      font-weight: 600;
      color: #f8fafc;
    }

    .stop-location {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.55);
    }

    .stop-setlist {
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .detail-panel {
      min-height: 280px;
    }

    .detail-empty {
      color: rgba(255, 255, 255, 0.45);
      text-align: center;
      padding: 2rem 1rem;
    }

    .badge-personal {
      font-size: 0.7rem;
      margin-right: 0.25rem;
    }

    .year-chip {
      cursor: pointer;
      margin: 0.15rem;
    }

    .year-chip.active {
      background: #667eea !important;
      border-color: #667eea !important;
    }

    @media (min-width: 992px) {
      #atlasMap { height: 520px; }
      .timeline-scroll { max-height: 520px; }
    }
  </style>
</head>
<body>
  <modern-navbar></modern-navbar>

  <header class="atlas-hero">
    <p class="kicker mb-1"><i class="bi-compass"></i> Live Music Pilgrimage Atlas</p>
    <h1>Grateful Dead Journey</h1>
    <p class="kicker mb-2">Map the endless tour — venues, setlists, and your pilgrimage stops</p>
    <div id="overviewStats"></div>
  </header>

  <main class="container-fluid px-3 px-lg-4 pb-4">
    <div class="filter-bar">
      <div class="row g-2 align-items-end">
        <div class="col-6 col-md-2">
          <label class="form-label small text-white-50">Mode</label>
          <select id="filterMode" class="form-select form-select-sm">
            <option value="tour">Tour route</option>
            <option value="city">By city</option>
            <option value="on_this_date">On this date</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label small text-white-50">Year</label>
          <select id="filterYear" class="form-select form-select-sm">
            <option value="">All years</option>
          </select>
        </div>
        <div class="col-6 col-md-2" id="monthDayGroup" style="display:none;">
          <label class="form-label small text-white-50">Month / Day</label>
          <div class="input-group input-group-sm">
            <input type="number" id="filterMonth" class="form-control" min="1" max="12" placeholder="MM">
            <input type="number" id="filterDay" class="form-control" min="1" max="31" placeholder="DD">
          </div>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label small text-white-50">City</label>
          <input type="text" id="filterCity" class="form-control form-control-sm" placeholder="Berkeley">
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label small text-white-50">State</label>
          <input type="text" id="filterState" class="form-control form-control-sm" placeholder="CA" maxlength="4">
        </div>
        <div class="col-12 col-md-2">
          <button type="button" class="btn btn-primary btn-sm w-100" id="btnApplyFilters">
            <i class="bi-funnel"></i> Explore
          </button>
        </div>
      </div>
      <div class="mt-2" id="yearChips"></div>
      <div class="mt-2 d-flex flex-wrap gap-2 align-items-center">
        <button type="button" class="btn btn-outline-light btn-sm" id="btnSaveRoute">
          <i class="bi-bookmark-plus"></i> Save route
        </button>
        <select id="savedRoutesSelect" class="form-select form-select-sm" style="max-width:220px;">
          <option value="">Saved routes…</option>
        </select>
        <a href="/music/music-time-machine.html" class="btn btn-outline-info btn-sm">
          <i class="bi-clock-history"></i> Time Machine
        </a>
        <a href="/music/my-grateful-dead-shows.html" class="btn btn-outline-success btn-sm">
          <i class="bi-calendar-heart"></i> My Shows
        </a>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-7">
        <div class="panel">
          <div class="panel-header"><i class="bi-geo-alt"></i> Tour map</div>
          <div id="atlasMap"></div>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="panel">
          <div class="panel-header d-flex justify-content-between align-items-center">
            <span><i class="bi-signpost-split"></i> Route stops</span>
            <span class="small text-white-50" id="stopCountLabel">—</span>
          </div>
          <div class="timeline-scroll" id="timelineList">
            <div class="detail-empty">Apply filters to load the journey…</div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-3 mt-1">
      <div class="col-12">
        <div class="panel detail-panel">
          <div class="panel-header"><i class="bi-music-note-beamed"></i> Stop story</div>
          <div id="detailPanel" class="p-3">
            <div class="detail-empty">Select a stop on the map or timeline to see setlist, links, and personal notes.</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/music/js/music-pilgrimage-atlas.js"></script>
</body>
</html>
