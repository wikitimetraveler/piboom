<!DOCTYPE html>
<!-- Development work by David Lane -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Historian — DevConnect Labs</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/music/css/music-historian-line.css" />
</head>
<body class="mhl-page">
  <main class="mhl-wrap">
    <article class="mhl-card" id="mhlCard" hidden>
      <p class="mhl-kicker">Music · HeyGen Historian</p>
      <h1 class="mhl-title" id="mhlTitle">Music Research</h1>
      <p class="mhl-lede" id="mhlLede"></p>
      <div id="mhlPlayWrap"></div>
      <div class="mhl-links" id="mhlLinks"></div>
    </article>
    <p id="mhlLoading" class="text-center text-muted">Loading…</p>
    <p class="mhl-heygen-foot" id="mhlHeygenFoot"></p>
  </main>

  <div class="mhl-popup-backdrop" id="mhlPopup" hidden role="dialog" aria-modal="true" aria-labelledby="mhlPopupTitle">
    <div class="mhl-popup">
      <div class="mhl-popup-head">
        <span id="mhlPopupTitle">Music Historian</span>
        <button type="button" class="btn btn-sm btn-close" id="mhlPopupClose" aria-label="Close"></button>
      </div>
      <div class="mhl-popup-body" id="mhlPopupBody"></div>
    </div>
  </div>

  <script src="/music/js/music-historian-line.js"></script>
</body>
</html>
