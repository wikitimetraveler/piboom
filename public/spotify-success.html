<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Spotify Connected - Big Wave Dave's Music Box</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"/>
<link rel="stylesheet" href="/styles.css"/>
<style>
  body {
    background: linear-gradient(135deg, #1db954 0%, #191414 50%, #1db954 100%);
    color: #fff;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .success-container {
    background: rgba(0, 0, 0, 0.8);
    border-radius: 20px;
    padding: 3rem;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    border: 2px solid #1db954;
    max-width: 500px;
    width: 90%;
  }
  
  .success-icon {
    font-size: 4rem;
    color: #1db954;
    margin-bottom: 1rem;
    animation: pulse 2s infinite;
  }
  
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  
  .success-title {
    font-size: 2rem;
    font-weight: bold;
    margin-bottom: 1rem;
    color: #1db954;
  }
  
  .success-message {
    font-size: 1.1rem;
    margin-bottom: 2rem;
    opacity: 0.9;
  }
  
  .user-info {
    background: rgba(29, 185, 84, 0.1);
    border: 1px solid #1db954;
    border-radius: 10px;
    padding: 1rem;
    margin-bottom: 2rem;
  }
  
  .user-name {
    font-size: 1.3rem;
    font-weight: bold;
    color: #1db954;
    margin-bottom: 0.5rem;
  }
  
  .user-details {
    font-size: 0.9rem;
    opacity: 0.8;
  }
  
  .action-buttons {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  
  .btn-spotify {
    background: #1db954;
    border: none;
    color: #000;
    padding: 0.75rem 1.5rem;
    border-radius: 25px;
    font-weight: bold;
    text-decoration: none;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }
  
  .btn-spotify:hover {
    background: #1ed760;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(29, 185, 84, 0.3);
    color: #000;
    text-decoration: none;
  }
  
  .btn-secondary {
    background: transparent;
    border: 2px solid #1db954;
    color: #1db954;
    padding: 0.75rem 1.5rem;
    border-radius: 25px;
    font-weight: bold;
    text-decoration: none;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }
  
  .btn-secondary:hover {
    background: #1db954;
    color: #000;
    transform: translateY(-2px);
    text-decoration: none;
  }
</style>
</head>
<body>
<div class="success-container">
  <div class="success-icon">
    <i class="bi-spotify"></i>
  </div>
  
  <h1 class="success-title">Spotify Connected!</h1>
  
  <p class="success-message">
    Your Spotify account has been successfully connected to Big Wave Dave's Music Box. 
    You can now access your personal music data and discover new tracks!
  </p>
  
  <div class="user-info" id="userInfo" style="display: none;">
    <div class="user-name" id="userName"></div>
    <div class="user-details" id="userDetails"></div>
  </div>
  
  <div class="action-buttons">
    <a href="/" class="btn-spotify">
      <i class="bi-house"></i> Go to Home
    </a>
    <a href="/spotify-dashboard.html" class="btn-secondary">
      <i class="bi-music-note-beamed"></i> My Spotify Data
    </a>
  </div>
  
  <div class="mt-4">
    <small class="text-muted">
      You can revoke access anytime in your Spotify account settings.
    </small>
  </div>
</div>

<script>
// Get user info from URL parameters or API
async function loadUserInfo() {
  try {
    // Try to get user info from URL parameters first
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId');
    const userName = urlParams.get('userName');
    
    if (userId && userName) {
      document.getElementById('userName').textContent = userName;
      document.getElementById('userDetails').textContent = `User ID: ${userId}`;
      document.getElementById('userInfo').style.display = 'block';
    } else {
      // If no URL params, try to get from API
      const response = await fetch('/api/spotify/current-user');
      if (response.ok) {
        const data = await response.json();
        if (data.success && data.user) {
          document.getElementById('userName').textContent = data.user.display_name || data.user.id;
          document.getElementById('userDetails').textContent = `Followers: ${data.user.followers || 0}`;
          document.getElementById('userInfo').style.display = 'block';
        }
      }
    }
  } catch (error) {
    // Could not load user info
  }
}

// Load user info when page loads
document.addEventListener('DOMContentLoaded', loadUserInfo);
</script>
</body>
</html>
