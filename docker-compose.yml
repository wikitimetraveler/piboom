version: '3.8'

services:
  pi-boom:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MODE=cloud
      - PORT=3000
    env_file:
      - .env
    volumes:
      # Mount music directory if you want to persist music files
      - ./music:/app/music:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a reverse proxy for production
