services:
  - type: web
    name: pi-boom
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    branch: main
    buildCommand: ""
    startCommand: ""
    envVars:
      - key: NODE_ENV
        value: production
      - key: MODE
        value: cloud
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: pi-boom-db
          property: connectionString
    healthCheckPath: /health
    autoDeploy: true

  - type: pserv
    name: pi-boom-db
    env: docker
    plan: starter
    region: oregon
    databaseName: piboom
    databaseUser: piboom
