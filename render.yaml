services:
  - type: web
    name: devconnect-labs
    runtime: node
    plan: starter
    region: oregon
    branch: main
    # Match previous Docker image: production deps only (no devDependencies). No Docker required.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MODE
        value: cloud
      - key: PORT
        value: 3000
      - key: AUTO_INGEST_DISASTERS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: devconnect-labs-db
          property: connectionString
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
    healthCheckPath: /health
    autoDeploy: true

  - type: pserv
    name: devconnect-labs-db
    env: docker
    plan: starter
    region: oregon
    databaseName: piboom
    databaseUser: piboom
